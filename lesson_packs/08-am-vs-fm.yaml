# ABOUTME: Lesson pack M8 "Two Shapes: AM vs FM" — the modulation intro; which property of the wave
# ABOUTME: carries the message, height (AM) or pitch (FM), is a shape you can read before you listen.

id: 8
slug: am-vs-fm
title: "Two Shapes: AM vs FM"
type: intro
concept: >-
  Modulation is which property of a wave carries the message — its height (AM) or its pitch (FM) —
  and the two draw different shapes on the waterfall, so you can tell them apart by sight, before
  you ever listen.
requires_tx: false
hardware: [rtl-sdr]
panels: []

stages:
  frame: >-
    Tonight, comrade, you learn to read a signal's modulation — the trick it uses to carry a message — straight
    off its shape on the waterfall, so you can call AM from FM on sight, with no speaker at all.
  demo: >-
    Watch — hands off for now. Two shapes. On a fine display, an airband AM voice channel is a
    single hard, bright line, dead still at center — the carrier — with brightness blooming and
    flickering around it as the words come and go. It's skinny, under ten kHz. That's AM: the
    message in height. Broadcast FM, from Lesson 1, is a fat block about 200 kHz wide that writhes
    side to side with the music. That's FM: the message in pitch.
  try: >-
    Your turn, comrade — eyes only; this console has no speaker yet, and the shapes are the
    lesson. The waterfall sits on the aircraft band. At this resolution an airband channel is one
    thin column of pixels, lit only while someone talks. Watch for one to blink on, then hold it
    against the wide FM blocks from Lesson 1: thin is AM, wide is FM.
  predict: >-
    In the silence between words, does a carrier vanish from the screen? Pick the one whose
    carrier disappears between words — the AM airband voice, the FM music station, or neither.
    Lock it in.
  observe: >-
    Watch one transmission from key-up to release. Between words, does the line stay lit? And at
    release? Why call it a carrier — what must it do in the quiet to earn the name?
  explain: >-
    Here's the straight answer: neither, while a transmission lasts. Watch an AM carrier through
    the quiet between words and the center line stays lit and rock-steady; what comes and goes is
    only the brightness riding on it. That's the whole idea of amplitude modulation: a steady
    carrier holds its spot on the dial, and the voice is written onto it as changes in height —
    louder sound, taller signal, more brightness blooming around the line. Stop talking for a
    moment and you haven't taken the carrier away; you've just stopped writing on it. That is
    literally why it's called a carrier: it carries the message, and it's still there in the
    silence. FM holds its carrier too — its message is written in pitch, so between notes the
    energy settles toward the center rather than blinking out. One catch: airband is
    push-to-talk. When the speaker lets go, the whole transmission ends, carrier and all, and the
    channel goes dark until the next key-up — which is why those thin columns blink. (A few
    channels, like ATIS recordings, never let go.) So the two shapes each ride a carrier that stays
    for as long as someone is transmitting: AM is a still line that flickers bright because height
    carries the message; FM is a wide band that wiggles because pitch carries it. This console has
    no speaker path yet; the shapes are the lesson, and they name the modulation before a single
    sound reaches your ears. One honest footnote, because a carrier that vanishes mid-message is a
    real thing, just not here: on-off keying — Morse with a flashlight — switches its carrier all
    the way off and on, and you'll meet it next lesson.

# The predict stage offers keyboard-free, tap-to-choose answers (no on-screen keyboard at the
# predict gate). Each is a {key, label}: the key is what the commit records, the label is what the
# learner reads. They stay neutral on purpose — the correct answer lives in `explain`, sealed
# behind the predict commit, so showing the choices never spoils the reveal.
choices:
  - {key: am, label: AM}
  - {key: fm, label: FM}
  - {key: neither, label: Neither}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: [neither]
verdict: >-
  Neither, while a transmission lasts: the carrier holds between words and goes only when
  push-to-talk is released.
