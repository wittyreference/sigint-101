# ABOUTME: Lesson pack M8 "Two Shapes: AM vs FM" — the modulation intro; which property of the wave
# ABOUTME: carries the message, height (AM) or pitch (FM), is a shape you can read before you listen.

id: 8
slug: am-vs-fm
title: "Two Shapes: AM vs FM"
type: intro
concept: >-
  Modulation is which property of a wave carries the message — its height (AM) or its pitch (FM) —
  and the two draw different shapes on the waterfall, so you can tell them apart by sight, before
  you ever listen.
requires_tx: false
hardware: [rtl-sdr]
panels: []
# The instrument sits on the whole VHF airband, 118-137 MHz, so a controller's channel shows wherever
# it is. rtl_power sweeps it in 7 hops and splits the 50 kHz request into ~42 kHz bins (448 a row):
# an AM voice channel is one thin line, and the row fits the waterfall one bin per pixel. The step
# is the 25 kHz airband channel spacing.
tune:
  center_hz: 127500000
  span_hz: 19000000
  step_hz: 25000
  bin_hz: 50000

stages:
  frame: >-
    Tonight, comrade, you learn to read a signal's modulation — the trick it uses to carry a message — straight
    off its shape on the waterfall, so you can call AM from FM on sight, with no speaker at all.
  demo: >-
    Watch — hands off for now. On a fine display an airband AM voice channel is one hard, bright
    line dead still at center, the carrier, with brightness flickering around it as words come and
    go, under ten kHz: the message in height. Broadcast FM, from Lesson 1, is a fat 200 kHz block
    that writhes: the message in pitch.
  try: >-
    Your turn, comrade — eyes only; this console has no speaker yet, and the shapes are the
    lesson. On the aircraft band, at this resolution, a channel is one thin column of pixels, lit
    only while someone talks. Watch for one to blink on, then hold it against Lesson 1's wide FM
    blocks: thin is AM, wide is FM.
  predict: >-
    Watch an airband channel through a conversation, comrade: its thin column lights, goes dark
    for a few seconds, then lights again. When it goes dark, what happened? Lock it in.
  observe: >-
    Watch one transmission from key-up to release. Between words, does the line stay lit? And at
    release? Why call it a carrier — what must it do in the quiet to earn the name?
  explain: >-
    They released push-to-talk. While the key is held, the AM center line stays lit through
    every pause; only the brightness on it comes and goes. That's amplitude modulation: a steady
    carrier, with the voice written on it as height. Stop talking and you've only stopped writing
    on it; that's why it's called a carrier. Release the key and the carrier goes too, until the
    next voice keys up. This screen draws a row a second, too slow to show a word gap anyway:
    every dark stretch is a transmission ending. A carrier that vanishes mid-message is on-off
    keying — next lesson. Carry this out the door: a still, flickering line is AM; a wide,
    wiggling band is FM.

# The predict stage offers keyboard-free, tap-to-choose answers (no on-screen keyboard at the
# predict gate). Each is a {key, label}: the key is what the commit records, the label is what the
# learner reads. They stay neutral on purpose — the correct answer lives in `explain`, sealed
# behind the predict commit, so showing the choices never spoils the reveal.
choices:
  - {key: ptt, label: They released push-to-talk}
  - {key: words, label: They paused between words}
  - {key: faded, label: The signal faded out}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: [ptt]
verdict: >-
  Released push-to-talk: an AM carrier holds through the pauses between words, so the column goes
  dark only when the transmitter stops.
