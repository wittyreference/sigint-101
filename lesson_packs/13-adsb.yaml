# ABOUTME: Lesson pack M13 "The Sky Talks" — ADS-B at 1090 MHz, aircraft broadcasting their identity
# ABOUTME: and position in the clear, decoded from Mode S into contacts placed on a radar scope.

id: 13
slug: adsb
title: "The Sky Talks"
type: intro
concept: >-
  Every airliner overhead broadcasts who it is, how high it flies and exactly where it sits — in the
  clear, on 1090 MHz, to anyone with a receiver. This opens the decode unit: you stop naming a
  signal's shape and start turning it into meaning. dump1090 reads the Mode S transmissions and hands
  you callsign, altitude and position; the console places each aircraft on a radar scope by its range
  and bearing. Nothing is cracked — it is an open published standard you simply decode.
requires_tx: false
hardware: [rtl-sdr]
panels: [adsb]
tune:
  center_hz: 1090000000
  span_hz: 2000000
  step_hz: 1000000

stages:
  frame: >-
    A new unit, comrade, and a new kind of listening. All of Unit 4 you spent naming shapes — on,
    off, a pitch, a chirp, a phase. Tonight you stop naming and start reading. Above you, right now,
    airliners are shouting their names into the sky: an open broadcast on 1090 MHz, several times a
    second, carrying a plane's identity, its altitude, its exact position over the ground. Tonight
    you build a radar.
  demo: >-
    Watch — hands off. No waterfall: it would show a faint smudge; the meaning is in the data. The
    scope is dump1090's radar: you at the centre, rings for distance, angle for compass bearing.
    Identity, altitude and position, speed: separate messages, joined into one track, a callsign on
    its ring. Quiet sky, empty scope: it never invents a plane.
  try: >-
    Your scope now, comrade. Give it a minute: ADS-B is a broadcast, not a request; planes appear
    only when they transmit. Read a contact: callsign, ring for distance, angle for bearing. If the
    sky is quiet or the antenna deaf to 1090 MHz, the scope says so plainly. Notice the shift: you
    are reading a message, not identifying a modulation.
  predict: >-
    An airliner overhead is transmitting on 1090 MHz. To put it on your scope — callsign, altitude,
    position — what must you have? Lock it in.
  observe: >-
    Look at what the scope gives you: not "a signal at 1090 MHz", all a waterfall could ever say,
    but a name, a height, a place. How much did you unlock, and how much simply arrived the moment
    you decoded it? And if the scope is empty: a failing decoder, or the honest answer that nothing
    up there is talking?
  explain: >-
    Nothing was broken into. ADS-B, Automatic Dependent Surveillance–Broadcast, has every equipped
    aircraft announce its identity and position in the clear on 1090 MHz, because air traffic is
    built on everyone hearing everyone. Decoding just demodulates pulses into bits and reads the
    fields a published international standard defines: a 24-bit aircraft address, callsign,
    barometric altitude, latitude and longitude. dump1090 unpacks the bits; the console turns each
    position into range and bearing from you, placing it on its ring. Listening is passive, as
    ordinary as a phone flight tracker (18 USC 2511(2)(g)(ii)(IV) covers aeronautical systems).
    Carry this out the door: in Unit 4 a signal's value was its shape; from here it is its content,
    read by a decoder, not a waterfall.

# Keyboard-free predict chips: {key, label}. None of these keys are YAML 1.1 booleans
# (yes/no/on/off/true/false), so they load as plain strings without needing quotes.
choices:
  - {key: key, label: "A key"}
  - {key: licence, label: "A licence"}
  - {key: nothing, label: "Nothing extra"}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: [nothing]
verdict: >-
  Nothing extra: ADS-B is an open, published broadcast; decoding it needs no key and no licence.
