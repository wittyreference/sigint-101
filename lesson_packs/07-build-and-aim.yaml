# ABOUTME: Lesson pack M7 "Build, Aim & Clean Up" — the build/aim intro; length, orientation, and
# ABOUTME: notching a too-strong neighbour out of the front end turn "nothing" into a clean signal.

id: 7
slug: build-and-aim
title: "Build, Aim & Clean Up"
type: intro
concept: >-
  Matching length and orientation, and keeping a too-strong neighbour out of the front end, turns
  "nothing" into a clean signal — a missing signal is sometimes too much, not too little antenna.
requires_tx: false
hardware: [rtl-sdr]
panels: []
# The instrument sits on the aircraft band the demo and try stages work on. ADS-B replies are about
# 2 MHz wide, so 31.25 kHz bins (64 across the span) show that hump at its real width.
tune:
  center_hz: 1090000000
  span_hz: 2000000
  step_hz: 1000000
  bin_hz: 31250

stages:
  frame: >-
    Tonight, comrade, you learn three ways to turn a dead-looking band into clean aircraft traffic —
    the right length, the right aim, and shoving a too-loud neighbour out of the radio's ear — and you learn
    that a missing signal sometimes means too much of the wrong thing, not too little antenna.
  demo: >-
    Watch — hands off for now. On 1090 MHz, legs near 6.9 cm, three things decide what gets in.
    Length, which you set. Aim: aircraft antennas hang vertical, so a flat dipole barely hears.
    Overload: strong FM can swamp the front end, the first amplifier behind the antenna, blinding
    the radio; an FM-notch filter throws 88–108 MHz away first.
  try: >-
    Now you run all three, comrade, one change at a time, eye on the floor at 1090: legs at
    6.9 cm; the dipole stood vertical; the FM-notch filter slid into the cable. Say what each move
    changed. If this antenna stays deaf at 1090, the floor barely moves — a real result, not your
    mistake.
  predict: >-
    Your 915 MHz gadget reads weak, comrade. No FM tower is near, and your dipole legs are still
    cut for 1090. Will sliding in the FM-notch filter make 915 stronger? Lock it in.
  observe: >-
    Reason from what the notch actually does, and say what you expect first: the filter removes one
    stretch, 88 to 108 MHz, and nothing else. Is 915 MHz anywhere inside it? And when 915 is weak,
    is the likelier culprit the far-off FM you removed, or the antenna length and aim from earlier?
  explain: >-
    No — wrong culprit. The notch is a targeted tool, not a cleanup: it removes the FM broadcast
    band, 88 to 108 MHz, and nothing else. It helps another band only when
    strong FM is swamping the front end and blinding the whole radio, as under a tower. With no
    tower near, there is nothing to take away, and the hiss at 915 isn't FM, so it isn't quieter
    either. Weak 915 wants last lesson's fix: legs grown to about 8.2 cm, aimed for how the gadget
    is polarized. Carry this out the door: name the disease first — length and aim are fixed at
    the antenna, an overloading neighbour with a notch, and more gain fixes neither.

# The predict stage offers keyboard-free, tap-to-choose answers (no on-screen keyboard at the
# predict gate). Each is a {key, label}: the key is what the commit records, the label is what the
# learner reads. They stay neutral on purpose — the correct answer lives in `explain`, sealed
# behind the predict commit, so showing the choices never spoils the reveal.
choices:
  - {key: "yes", label: "Yes, it cleans the radio up"}
  - {key: "no", label: "No, wrong culprit"}
  - {key: little, label: "A little, less noise overall"}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
# The stem rules out the one case where the notch would help (strong FM nearby), so one chip is right.
answer: ["no"]
verdict: >-
  No: the notch removes only 88 to 108 MHz. With no strong FM overloading the front end, it does
  nothing for 915. Lengthen the legs to about 8.2 cm.
