# ABOUTME: Lesson pack M7 "Build, Aim & Clean Up" — the build/aim intro; length, orientation, and
# ABOUTME: notching a too-strong neighbour out of the front end turn "nothing" into a clean signal.

id: 7
slug: build-and-aim
title: "Build, Aim & Clean Up"
type: intro
concept: >-
  Matching length and orientation, and keeping a too-strong neighbour out of the front end, turns
  "nothing" into a clean signal — a missing signal is sometimes too much, not too little antenna.
requires_tx: false
hardware: [rtl-sdr]
panels: []

stages:
  frame: >-
    Tonight, comrade, you turn a dead-looking band into clean aircraft traffic three ways at once — the right
    length, the right aim, and shoving a too-loud neighbour out of the radio's ear — and you learn
    that a missing signal sometimes means too much of the wrong thing, not too little antenna.
  demo: >-
    Watch — hands off for now. Start where last lesson left off: dipole legs near 6.9 cm for 1090
    MHz, radio on the aircraft band, a few faint planes. First move is aim. The legs lie flat;
    watch the SNR as I stand the dipole up, both legs vertical — the returns jump, more planes,
    cleaner. That's polarization: an aircraft antenna hangs vertically, so a vertical antenna
    drinks its signal in while a crosswise one barely hears. Same antenna, same length — only the
    angle changed. Now the strange one: near strong FM the aircraft band can look wrecked, the
    floor smeared and planes drowning, and the beginner thinks "antenna too small." Watch the real
    fix: I slide an FM-notch filter inline — its only job is to throw away the 88-to-108 MHz band
    before it reaches the radio. The smear collapses and the planes pop out clean. The antenna
    never changed: the trouble was never too little signal at 1090, it was far too much at 100 —
    so loud it overloaded the front end and blinded the radio everywhere.
  try: >-
    Now you run all three, comrade. On 1090, set the legs to the 6.9-centimetre quarter-wave and
    read the SNR; rotate the dipole from flat to vertical and watch it climb; then slide the
    FM-notch filter into the cable and watch the floor. Change one thing at a time, SNR in view,
    and say what each move bought: length got you to the ballpark, aim squeezed out more, the notch
    cleared the smear if FM was overloading you.
  predict: >-
    The notch just rescued the aircraft band, so it's tempting to treat it as a clean-everything
    button. The call: retune down to 915 MHz, where small wireless gadgets live, and suppose their
    signal looks weak. Will inserting that same FM-notch filter help 915 — YES, NO, or IT DEPENDS?
    Lock it in — the rest stays hidden until you do.
  observe: >-
    Reason from what the notch actually does, and say what you expect first: the filter removes one
    stretch, 88 to 108 MHz, and nothing else. Is 915 MHz anywhere inside it? And when 915 is weak,
    is the likelier culprit the far-off FM you removed, or the antenna length and aim from earlier?
  explain: >-
    Here's the straight answer: no — not on its own. The FM-notch filter does exactly one thing,
    remove the 88-to-108 MHz broadcast band, and 915 is nowhere near it, so the notch doesn't touch
    your 915 signal at all. It is a targeted tool, not a general cleanup: the only reason it rescued
    1090 is that strong FM was overloading the radio's front end and smearing the whole picture, and
    pulling that one loud band out let everything else recover. So the single case where it helps at
    915 is the very same disease — if that same FM broadcast were overloading you there too — but it
    can never conjure a 915 signal your antenna is missing, because it adds nothing and it doesn't
    filter 915. If your 915 reception is weak, the fix is last lesson's: is the dipole the right
    length for 915 — the legs want to grow to about 8.2 centimetres — and is it aimed right for how
    that gadget is polarized? That's the real lesson tonight, and it cuts both ways. "Signal is
    missing" does not always mean "antenna too small." Sometimes it means too much of the wrong
    thing — a neighbour so loud it blinds the front end — and the cure is to take away, not to add. A
    good operator asks which disease they have before reaching for a tool: wrong length and wrong aim
    are fixed at the antenna; an overloading neighbour is fixed with a notch; and more gain, as you
    learned early on, fixes neither.

# The predict stage offers keyboard-free, tap-to-choose answers (no on-screen keyboard at the
# predict gate). Each is a {key, label}: the key is what the commit records, the label is what the
# learner reads. They stay neutral on purpose — the correct answer lives in `explain`, sealed
# behind the predict commit, so showing the choices never spoils the reveal.
choices:
  - {key: "yes", label: "Yes"}
  - {key: "no", label: "No"}
  - {key: depends, label: It depends}
