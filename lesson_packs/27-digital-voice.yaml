# ABOUTME: Lesson pack M27 "The Coded Voice" — digital voice (DMR / P25): speech sent as a bitstream,
# ABOUTME: decoded with DSD-FME into talkgroup and source IDs, call activity, and — when open — speech.

id: 27
slug: digital-voice
title: "The Coded Voice"
type: intro
concept: >-
  The world's two-way radio went digital. DMR (business and amateur) and P25 (public safety) carry
  voice not as an analog tone you can simply tune in, but as a bitstream: a four-level FSK signal —
  C4FM on P25 Phase 1 — that a decoder like DSD-FME demodulates, frames, and splits in two. The
  signaling half rides in the clear — a talkgroup ID (which conversation) and a source ID (which
  radio) — because the system itself must read it to route the call; the voice half is compressed by
  a vocoder and, on many systems, encrypted. On a trunked network many talkgroups share a pool of
  channels, so what you watch is call activity: IDs lighting up as conversations hop. It is the
  unit's one move again — energy into meaning — with a new final stage: the vocoder.
requires_tx: false
hardware: [rtl-sdr]
panels: [dmr]
tune:
  center_hz: 450000000
  span_hz: 200000
  step_hz: 12500

stages:
  frame: >-
    All unit long, comrade, you turned energy into meaning — a plane's position, a ham's packet, a
    pager's line, an aircraft's typed note. One kind of meaning is still missing: a human voice. Back
    in the modulation lessons an FM voice was easy — demodulate, and you simply hear it. Tonight the
    voice is harder, because the radios that carry it went digital. DMR runs business and amateur UHF;
    P25 runs public safety. Both turn speech into a bitstream before it ever leaves the antenna. You
    cannot just listen to it. You have to decode it.
  demo: >-
    Watch — hands off. rtl_fm feeds DSD-FME, which locks to the four-level FSK, finds the frame,
    splits it in two. The signaling, in the clear: talkgroup ID (which conversation), source ID
    (which radio), scrolling as call activity. The voice: compressed bits a vocoder rebuilds. DMR
    fits two calls per channel in alternating time slots; P25 Phase 1, one.
  try: >-
    Your log now, comrade. Digital voice comes in calls, not a steady stream — a source ID keys up
    on a talkgroup, says its piece, releases. Give it time and watch the IDs arrive: which
    talkgroup, which radio. This console has no speaker yet, so the voice half stays a question —
    the whole question of this lesson.
  predict: >-
    You decode a busy DMR channel; talkgroup IDs keep scrolling past. How many of those calls will
    also give you clear speech? Lock it in.
  observe: >-
    Hold your guess against the panel. The IDs arrived for every call — the system needed them in
    the clear to route the traffic, so the decoder read them too. The voice is separate. What stands
    between a stream of bits and a sentence you understand? A vocoder to rebuild it, and sometimes a
    lock you do not hold.
  explain: >-
    Every call gave up its IDs, which the network reads to connect it; only some, speech. Voice
    is compressed: AMBE+2 on DMR and P25 Phase 2, older IMBE on P25 Phase 1 — proprietary,
    patent-touched codecs DSD-FME rebuilds through mbelib, not a plain demodulation. Many systems
    encrypt it too (DMR privacy modes, P25 DES or AES), header still clear: IDs scroll on, the
    vocoder gives silence or garble, and a busy channel tells you nothing. The law draws the same
    line: unencrypted public-safety voice is lawful to hear under federal law (18 USC
    2511(2)(g)(ii)(II)), decrypting what was encrypted is not, and some states restrict scanners in
    cars. Carry this out the door: digital voice adds stages: demodulate, frame, de-interleave,
    vocoder.

# Keyboard-free predict chips: {key, label}. Keys quoted so a YAML-boolean word stays text; none of
# these are booleans, but the quotes keep the whole set consistent and safe to extend.
choices:
  - {key: "always-voice", label: "All of them"}
  - {key: "ids-voice-sometimes", label: "Some of them"}
  - {key: "nothing", label: "None of them"}

# The predict asks what is true, not what the radio will show, so the reveal reads "In fact".
predict_kind: knowledge

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: ["ids-voice-sometimes"]
verdict: >-
  Some of them: the IDs ride in the clear on every call, but voice is vocoded and often encrypted.
