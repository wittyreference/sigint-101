# ABOUTME: Lesson M19 "Catch the Catcher" — the IMSI-catcher/cell-site-simulator detector: an Orbic
# ABOUTME: running EFF's Rayhunter, polled receive-only; red means look closer, green never proves absence.

id: 19
slug: catch-the-catcher
title: "Catch the Catcher"
type: intro
concept: >-
  A cell-site simulator hides inside the control-plane handshake your SDR cannot read, so you borrow
  a hotspot running EFF's Rayhunter to read it. A red flag means look closer, never a proven catcher;
  a green line never proves none was near.
requires_tx: false
hardware: [orbic-rayhunter]
panels: [rayhunter]

stages:
  frame: >-
    Third night on the counter-surveillance track, comrade. In the first you met the one law — a quiet
    detector never proves you are safe. In the second you turned your own radio into a camera-catcher.
    Tonight the quarry is the fake tower: the cell-site simulator, the Stingray, the IMSI-catcher. And
    here is the twist — your SDR cannot catch this one. To hear a Stingray you must sit inside the
    private conversation your phone has with the tower, and that conversation is on the air, but
    packed inside an LTE carrier wider than your dongle and addressed to one phone; only a modem in
    the conversation can read it. So tonight you borrow a different radio.
  demo: >-
    Watch — hands off. You borrow a cheap Orbic hotspot running Rayhunter, the EFF's open-source
    catcher-catcher. It taps its modem's diagnostic feed to read the control-plane handshake with
    the tower, before any data rides, and flags what a normal tower has no reason to do: shove you
    down to easily intercepted 2G, or demand your permanent IMSI out of turn.
  try: >-
    Your watch, comrade. The console joins the Orbic's WiFi and polls its page at 192.168.1.1:8080
    (recordings, findings as JSON, captures): receive-only, off the tailnet. Its screen's line:
    green while recording cleanly; yellow, orange, then solid red as a warning grows; white when
    paused. Warnings come tagged low, medium or high. Red: what have you been handed?
  predict: >-
    Rayhunter's status line snaps to solid red while you ride the bus. Does red prove a cell-site
    simulator is operating nearby? Lock it in.
  observe: >-
    Weigh your guess against what the heuristic does. It never sees a Stingray; it matches
    signaling against rules for behavior a tower should not show. The hard part: is a cell-site
    simulator the only thing that could produce that pattern — or could a tower you've never
    camped on, freshly installed or plain misconfigured, trip the very same rule?
  explain: >-
    No, comrade, red doesn't prove a catcher. Rayhunter's flags are heuristics: EFF's own docs warn
    its IMSI-request rule false-positives on landing aircraft, older downgrade rules were
    noisy, and an incomplete broadcast "on its own might just be a misconfigured base
    station." A catcher and a brand-new legitimate tower can wear the same signature; the detector
    reads behavior, not intent. So red means look closer — change location, note the time, save the
    capture — never proof. Green all day means only that no known rule fired, on one modem, while
    it recorded; a trick no rule covers, or a strike while paused, stays green. Carry this out the
    door: no alert never means no catcher — awareness, bounded and receive-only.

# Keyboard-free predict chips: {key, label}. Keys quoted so a YAML-boolean word stays text.
choices:
  - {key: "proves-catcher", label: "Yes"}
  - {key: "look-closer", label: "No"}
  - {key: "near-proof", label: "Nearly"}

# The predict asks what is true, not what the radio will show, so the reveal reads "In fact".
predict_kind: knowledge

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: ["look-closer"]
verdict: >-
  No: red means a heuristic fired, and a new or misconfigured tower can trip the same rule. Look
  closer.
