# ABOUTME: Lesson pack M26 "The Sea Talks" — AIS at 161.975/162.025 MHz, ships broadcasting their
# ABOUTME: identity and position in the clear, decoded from AIVDM into a vessel roster keyed by MMSI.

id: 26
slug: ais
title: "The Sea Talks"
type: intro
concept: >-
  In Lesson 13 the sky talked; here the sea does. Big ships broadcast who they are, where they sit
  and which way they are steaming — in the clear, on marine VHF around 162 MHz, to anyone with a
  receiver. AIS rides two channels at once, 161.975 and 162.025 MHz, as 9600-bps GMSK bursts. rtl_ais
  demodulates them into AIVDM sentences; the console sorts the sentences into a roster, one row per
  vessel, keyed by the ship's MMSI — the sea's twin of the ADS-B radar, keyed by ICAO hex.
requires_tx: false
hardware: [rtl-sdr]
panels: [ais]
tune:
  center_hz: 162000000
  span_hz: 200000
  step_hz: 25000

stages:
  frame: >-
    A cousin of Lesson 13, comrade, and the same trick on the water. Up there, airliners shouted their
    names into the sky; down here every big ship does the same across the harbour. AIS — the sea's own
    collision-avoidance chatter — rides marine VHF around 162 megahertz: a vessel announces who it is,
    where it sits, which way it is steaming, several times a minute, in the clear, to anyone listening.
    No permit, no key, no secret. Tonight you build the radar again, this time for the sea.
  demo: >-
    Watch — hands off. No waterfall; the meaning is in the data. rtl_ais hears both channels,
    161.975 and 162.025 MHz — ships split traffic across the pair; a 2 MHz dongle spans both — and
    turns GMSK bursts into AIVDM sentences. The catch: position rides one message, the name a
    longer one, yet both land on one row.
  try: >-
    Your roster now, comrade. AIS broadcasts on a schedule: a vessel appears only when it checks
    in. Read a row — the nine-digit MMSI naming the ship, its position, its course; the name fills
    in when the slower static message arrives. Inland, an empty roster is the honest answer, not a
    fault. What matches the sky, and what is new?
  predict: >-
    A ship's position and its name ride in two different AIS messages. What stitches them into one
    vessel? Lock it in.
  observe: >-
    Hold your guess against what the roster does. The position arrived in one burst, the name in
    another, maybe seconds apart — yet they land on a single line. Ask what the console had to match to
    know they are the same ship, and whether the sky's radar did anything different.
  explain: >-
    The MMSI, comrade. AIS — the Automatic Identification System, ITU recommendation M.1371 —
    splits a ship's story across message types. A position report (types 1, 2 and 3) carries the
    MMSI, position, course and speed; a static-and-voyage report (type 5) carries the same MMSI
    plus name, call sign, dimensions and destination, long enough to arrive as two AIVDM sentences
    the console rejoins. Every message opens with that nine-digit Maritime Mobile Service Identity,
    so the roster keys on it. Nothing is cracked: safety at sea means everyone hears everyone,
    AIVDM is a published format, and ship-tracking websites run on exactly this. Carry this out the
    door: same instrument, new water; an empty inland sea means no ships, not a broken decoder.

# Keyboard-free predict chips: {key, label}. Keys quoted so a YAML-boolean word stays text.
choices:
  - {key: "timing", label: "Timing — same instant"}
  - {key: "onemsg", label: "One message holds both"}
  - {key: "mmsi", label: "A shared ID (MMSI)"}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: ["mmsi"]
verdict: >-
  A shared ID: every AIS message opens with the ship's MMSI, so the console files position and name
  under it.
