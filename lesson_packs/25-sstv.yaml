# ABOUTME: Lesson pack M25 "A Picture in the Air" — SSTV, a still image sent as warbling audio tones,
# ABOUTME: decoded line by line into a real photo; the ISS sends it on 437.550 MHz FM (Robot36).

id: 25
slug: sstv
title: "A Picture in the Air"
type: intro
concept: >-
  APT painted a picture in loudness; SSTV paints one in pitch. Slow-scan television sends a still
  image as a minute or two of warbling audio: the pitch of a tone is a pixel's brightness, its place
  in time is the pixel's place across the line, and a sync tone starts each new line. rtl_fm
  demodulates the FM audio and an SSTV decoder repaints the tones into an image, top to bottom. Hams
  swap pictures this way on HF and VHF, and during ARISS events the ISS beams them down — on
  437.550 MHz FM in Robot36 since 2026, on 145.800 before that. New payload, same move: energy
  becomes a photograph.
requires_tx: false
hardware: [rtl-sdr]
panels: [sstv]
tune:
  center_hz: 437550000
  span_hz: 200000
  step_hz: 100000

stages:
  frame: >-
    Last lesson, comrade, a satellite painted a picture in loudness. Tonight the air paints one in
    pitch. Slow-scan television — SSTV — is how an operator sends a still image over a voice
    channel, with nothing but sound. For a minute or two the radio warbles, a rising-and-falling
    tone that means nothing to your ear, and when a decoder reads it a photograph paints itself down
    the screen. Hams trade them on the HF nets; the Space Station itself drops them to Earth during
    ARISS events. A signal, and inside it, an image.
  demo: >-
    Watch — hands off. Here is the trick of it, comrade. The image is sent one line at a time, and
    inside a line the rule is simple: the pitch of the tone is the brightness of a pixel — low for
    dark, high for bright — and where that tone falls in time is where the pixel sits across the line.
    A short sync tone marks the start of each new line so the picture does not slide. Up front rides a
    VIS header, a little burst of tones that names the mode — Robot 36, Martin, Scottie — so the
    decoder knows the timing and colour order before the picture even begins. rtl_fm pulls the FM
    audio off the air; the SSTV decoder reads the tones and lays down pixels, line after line, until a
    full frame stands finished. Nothing was hidden. It is a photograph spelled out loud, slowly.
  try: >-
    Your turn, comrade — wait for a picture. SSTV comes when an operator sends a frame, and a frame
    is slow by design, so give it the minute or two it needs and watch it build from the top edge
    down. 437.550 is the one to dream about: ARISS events have used it since 2026 (145.800 before
    that; ariss.org lists each event's frequency and mode). Ask yourself what comes out the far end
    of all that warbling.
  predict: >-
    A minute of warbling tones — no words, no station name. Feed it to the decoder: a real photo, or
    just noise? Lock it in.
  observe: >-
    Hold your guess against what the decoder is really doing. It is not translating a language or
    cracking a code; it is reading pitch as brightness and time as position, exactly as the sender
    laid them down. Ask yourself whether anything in that chain was ever hidden from you.
  explain: >-
    The straight answer, comrade: a real photo. SSTV hides nothing — it is a picture written in sound.
    Each line is a sweep of tones where frequency is brightness; a 1200-hertz sync tone opens every
    line; and the VIS header up front tells the decoder which mode it is, so the timing and the colour
    channels line up. Give the decoder a mode it knows how to read — Robot 36, Martin, Scottie are the
    common ham ones — and it repaints the frame pixel by pixel. No encryption, no key, just a format
    agreed between sender and receiver. ARISS has sent its ISS images on 437.550 MHz FM in Robot36
    since 2026, allowing about 10 kHz of Doppler either way as the station passes; through 2025 it
    used 145.800 FM, often in PD120 — the VIS header is what tells the decoder which. This is the
    decode track's whole lesson wearing a new coat: a receiver only hears energy, and a decoder that
    knows the format turns that energy into meaning. For the aircraft it was a line of text; here it
    is a face, a map, a postcard from orbit. Receive-only, as ever — you read the picture out of the
    air, you do not transmit one back.

# Keyboard-free predict chips: {key, label}. Keys quoted so a YAML-boolean word stays text, and so
# the commit records the string, not True/False.
choices:
  - {key: "photo", label: "A real photo appears"}
  - {key: "noise", label: "Just noise and static"}
  - {key: "numbers", label: "Only raw numbers"}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: ["photo"]
verdict: >-
  A real photo: SSTV writes brightness as pitch and position as time; a decoder that knows the mode
  repaints it.
