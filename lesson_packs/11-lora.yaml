# ABOUTME: Lesson pack M11 "Below the Noise Floor" — LoRa chirp spread spectrum, a signal decoded
# ABOUTME: from under the noise with processing gain, read off the Nomad's own meshtastic radio.

id: 11
slug: lora
title: "Below the Noise Floor"
type: intro
concept: >-
  LoRa sends each symbol as a chirp — the carrier sweeping across the band — and the receiver
  "de-chirps" it, collapsing the spread-out signal into one narrow tone while the noise stays
  spread and low. That processing gain lets a packet decode at a negative SNR, below the noise
  floor, where a plain data signal as wide would be lost and a waterfall shows nothing. It is why
  LoRa reaches kilometres on a small battery, and the code the Nomad's own mesh radio speaks.
requires_tx: false
hardware: [lora]
panels: [lora]

stages:
  frame: >-
    Tonight, comrade, the strangest carrier yet. You have seen one blink off, one shift its pitch, one
    swell in height. LoRa does none of these — it sweeps, a chirp sliding across the band, and that
    chirp can be dug out of noise so deep your SDR could not even see it. No waterfall tonight: the
    Nomad's own mesh radio listens, and you will watch it read a packet from below the noise floor.
  demo: >-
    Watch — hands off for now. When a node transmits, the Nomad's LoRa radio (meshtastic) prints a
    line: sender, message, and the SNR it decoded at. Watch that number: often NEGATIVE, weaker
    than the noise, yet the packet decoded whole. Ten dB under the noise a plain data signal is
    gone; a LoRa chirp is a packet.
  try: >-
    Your turn, comrade. If a second Meshtastic node is in reach, send from it, at least 50 cm from
    the Nomad, and read the SNR on the line that lands. Send a few: how far below zero can it go yet
    arrive whole? No second node? Neighbours' nodes may land here too, and an empty list is the
    honest answer.
  predict: >-
    A LoRa packet arrives twelve dB below the noise floor — weaker than the very noise around it. Does
    it decode cleanly, arrive garbled, or fail outright? Lock it in.
  observe: >-
    Go back to the list and find a reception, eye on its SNR. Is that number above zero or below it?
    And sit with the puzzle: if the signal is genuinely weaker than the noise, how can the radio read
    it at all — what is the chirp doing that a steady carrier never could?
  explain: >-
    Clean, from below zero. LoRa — Long Range — is chirp spread spectrum: each symbol a chirp
    sweeping linearly across the band, multiplied at the receiver by a reference down-chirp.
    De-chirping collapses the symbol into one tone; the unmatched noise stays spread thin. That
    gathering is processing gain: packets decode at minus ten, even about minus seventeen dB SNR on
    LongFast, where a waterfall shows an empty band. So LoRa reaches kilometres on a small
    battery, trading raw speed for reach. You read these because the sender shares your
    channel's key; another channel's packet lands as "encrypted", its SNR just as real: received,
    not readable. Carry this out the door: hearing a signal and reading it are two different
    things.

# Keyboard-free predict chips: {key, label}. None of these keys are YAML 1.1 booleans
# (yes/no/on/off/true/false), so they load as plain strings without needing quotes.
choices:
  - {key: decodes, label: "Decodes cleanly"}
  - {key: garbles, label: "Arrives garbled"}
  - {key: fails, label: "Fails — too weak"}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: [decodes]
verdict: >-
  It decodes cleanly: de-chirping gathers the spread symbol into one spike that stands above the
  noise.
