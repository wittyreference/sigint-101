# ABOUTME: Lesson pack M11 "Below the Noise Floor" — LoRa chirp spread spectrum, a signal decoded
# ABOUTME: from under the noise with processing gain, read off the Nomad's own meshtastic radio.

id: 11
slug: lora
title: "Below the Noise Floor"
type: intro
concept: >-
  LoRa sends each symbol as a chirp — the carrier sweeping across the band — and the receiver
  "de-chirps" it, collapsing the spread-out signal into one narrow tone while the noise stays
  spread and low. That processing gain lets a packet decode at a negative SNR, below the noise
  floor, where a plain data signal as wide would be lost and a waterfall shows nothing. It is why
  LoRa reaches kilometres on a small battery, and the code the Nomad's own mesh radio speaks.
requires_tx: false
hardware: [lora]
panels: [lora]

stages:
  frame: >-
    Tonight, comrade, the strangest carrier yet. You have seen one blink off, one shift its pitch, one
    swell in height. LoRa does none of these — it sweeps, a chirp sliding across the band, and that
    chirp can be dug out of noise so deep your SDR could not even see it. No waterfall tonight: the
    Nomad's own mesh radio listens, and you will watch it read a packet from below the noise floor.
  demo: >-
    Watch — hands off. The Nomad's LoRa radio logs sender, message and SNR — often NEGATIVE,
    weaker than the noise, yet decoded whole where plain data is gone.
  try: >-
    Send a few from a second Meshtastic node at least 50 cm from the Nomad (antenna always on,
    region, Long Turbo); read SNR. Alone, an empty list is the honest answer.
  predict: >-
    A LoRa packet on this radio's Long Turbo preset arrives twelve dB below the noise floor —
    weaker than the noise around it. Does it decode cleanly, arrive garbled, or fail outright?
    Lock it in.
  observe: >-
    Check a reception's SNR: above zero or below? If the signal is weaker than the noise, how can
    the radio read it — what does the chirp do a steady carrier can't?
  explain: >-
    Clean, from below zero. LoRa — Long Range — is chirp spread spectrum: each symbol a chirp
    sweeping across the band, multiplied by a reference down-chirp. De-chirping collapses the
    symbol into one tone; unmatched noise stays spread thin. That processing gain lets packets
    decode at minus ten, even about minus seventeen dB SNR on Long Turbo (SF11, 500 kHz; see
    Lesson 05 for why the kit uses it with power kept to its 8 dBm FCC grant), where a waterfall
    shows nothing. You read these because the sender shares your channel's key; another channel
    lands as "encrypted", its SNR just as real: received, not readable. Carry this out the door:
    hearing a signal and reading it are two different things.

# Keyboard-free predict chips: {key, label}. None of these keys are YAML 1.1 booleans
# (yes/no/on/off/true/false), so they load as plain strings without needing quotes.
choices:
  - {key: decodes, label: "Decodes cleanly"}
  - {key: garbles, label: "Arrives garbled"}
  - {key: fails, label: "Fails — too weak"}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: [decodes]
verdict: >-
  It decodes cleanly on Long Turbo (SF11), to about −17 dB: de-chirping lifts the symbol above the
  noise. Short and Medium presets fail sooner.

