# ABOUTME: Lesson M20 "The First Inch" — Unit 6 opener (no RF): the antenna turns a wave into a
# ABOUTME: microvolt whisper, the first amplifier's noise figure sets sensitivity, too much gain overloads.

id: 20
slug: the-front-end
title: "The First Inch"
type: intro
concept: >-
  The first amplifier a faint signal meets sets what the receiver can hear; too much gain overloads it.
requires_tx: false
hardware: []
panels: []

stages:
  frame: >-
    Tonight, comrade, we lift the lid. Every lesson so far you worked the radio from outside. Now we
    go inside, to the first inch between antenna and everything else — pure theory, but the inch that
    decides how faint a signal you can ever hear.
  demo: >-
    Follow the signal in. A wave wiggles your antenna's electrons into a microvolt whisper. The first
    amplifier, the LNA, lifts it before the receiver's own hiss buries it. Each stage adds hiss — its
    noise figure — but the FIRST stage's sets the whole receiver's sensitivity.
  try: >-
    Reason it through, comrade. Two amplifiers go behind the antenna — one quiet, one ordinary and
    hissy. One meets the bare whisper first; the other sees a signal already lifted. Which position
    does more to decide what you can hear?
  predict: >-
    Two amplifiers go behind the antenna: one quiet, one ordinary. To hear the faintest signal, which
    goes first — quiet or ordinary? Lock it in.
  observe: >-
    Hold your guess against the chain. The first amplifier is the only one that meets the signal
    while it is still a bare whisper, and whatever hiss it adds no later stage can undo. So whose hiss
    matters most?
  explain: >-
    The quiet one first, comrade — always. Its hiss lands on the bare whisper and rides forever; a
    noisy amp there poisons the well. That is why the first stage's noise figure sets sensitivity. But
    too much gain overloads the front end on a strong signal, spraying false copies.

