# ABOUTME: Lesson pack M5 "The One Rule" — the legal/ethics line (no RF): listening is broad and
# ABOUTME: mostly lawful, transmitting is licensed; taught as knowledge, never a lockout (D16).

id: 5
slug: the-rules
title: "The One Rule"
type: intro
concept: >-
  Listening is broad and mostly lawful; transmitting is licensed — the one line to know is between
  receiving and transmitting, with a few hard limits on listening.
requires_tx: false
hardware: []
panels: []

stages:
  frame: >-
    Tonight, comrade, the one rule — the single line that keeps this instrument a gift and not a
    problem. The radio in your hands can hear almost the whole spectrum and can talk on part of it,
    and the law treats those two powers very differently. Learn where the line sits once, and you
    never have to guess again.
  demo: >-
    Here is the whole of it, and it is simpler than people fear. Receiving — listening — is broad
    and, in most places, lawful: you may tune and watch nearly anything your radio can hear, the way
    you have all course. There are honest limits on listening: you may not break encryption to read
    what was scrambled; you may not intercept phone calls or pager messages carried by a phone or
    paging company at all; and you may not pass on a private message you happen to catch.
    Transmitting is the other power, and it is the licensed one: keying up on the amateur bands
    needs an amateur licence, and every band has its own rule for who may talk and how loud. Some
    bands — the 915 MHz band your LoRa and Meshtastic use — allow licence-free transmitting under
    FCC Part 15, inside set power limits. So the line is simple: listen within those limits,
    transmit only where you are authorised.
  try: >-
    Your turn, comrade — sort these four in your head before the next screen. One: you watch an
    unencrypted aircraft channel scroll by. Two: you record a neighbour's encrypted phone call and
    descramble it. Three: you key up on a ham repeater with no licence. Four: you send a text to a
    friend's Meshtastic node on the LoRa band. Which sit on the safe side of the line — and which
    one is the single power the whole rule is really about?
  predict: >-
    You listened to the local ham repeater all evening. Now you key up and transmit on it yourself,
    with no licence. Is that legal? Lock it in — the rest stays hidden until you do.
  observe: >-
    Hold your guess against the one line. Of the four you just sorted and the one you just answered,
    which were receiving and which were transmitting — and once you knew which side a thing was on,
    did the answer get easier?
  explain: >-
    No, comrade — the clearest case of the rule. Walk the four back: the aircraft channel is
    receiving — fine. Descrambling the neighbour's phone breaks encryption and intercepts a
    carrier's call, which is the offence in itself, recorded or not, passed on or not — not fine.
    (The scanner rule you may hear of, 47 CFR 15.121, governs which scanners may be certified and
    sold, not owning a receiver like this one.) The ham repeater is transmitting unlicensed — not
    fine. The Meshtastic text is transmitting too, but on a band that allows licence-free use
    under Part 15, so it is fine inside its power limits. Carry this out the door: receiving is
    broad and mostly lawful, transmitting is licensed; the exam trainer is your on-ramp to a
    licence, not a lock. Specifics vary by country and, for listening, by state — treat this as
    the shape of the law, and check your local rules before you rely on it.

# The predict stage offers keyboard-free, tap-to-choose answers (no on-screen keyboard at the
# predict gate). Each is a {key, label}: the key is what the commit records, the label is what the
# learner reads. Keys are quoted so a YAML-boolean word could never coerce them to True/False.
choices:
  - {key: "legal", label: "Legal"}
  - {key: "illegal", label: "Illegal"}
  - {key: "identify", label: "Legal if you identify"}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: ["illegal"]
verdict: >-
  Illegal: listening to the repeater was fine, but transmitting on it needs an amateur licence.
