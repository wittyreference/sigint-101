# ABOUTME: Lesson pack M12 "The Hidden Text" — PSK seen through RDS, data carried in the phase of an
# ABOUTME: FM subcarrier, invisible on the waterfall and read only with a decoder (rtl_fm|redsea).

id: 12
slug: rds
title: "The Hidden Text"
type: intro
concept: >-
  Phase-shift keying hides data in the timing of the wave — the phase — leaving the height and the
  frequency untouched, so a waterfall shows the signal's energy but never its bits. RDS is the
  everyday example: most FM stations flip the phase of a quiet 57 kHz subcarrier to carry their
  station name and scrolling text, and you read it only by decoding the phase. It closes the
  modulation unit: the shape your eyes can never see.
requires_tx: false
hardware: [rtl-sdr]
panels: [rds]
tune:
  center_hz: 106500000
  span_hz: 400000
  step_hz: 100000

stages:
  frame: >-
    Tonight, comrade, the subtlest trick yet. You have read a carrier by its height, its on and
    off, its pitch, its chirp. The last moves the timing of the wave itself — the phase. And it
    hides in plain sight: most FM stations you have tuned carry a stream of text in the phase of a
    quiet subcarrier, a second signal tucked inside the station's own. Tonight you read the words
    that were there all along.
  demo: >-
    Watch — hands off for now. No waterfall tonight. redsea is listening to the station on the
    dial and pulling a hidden stream out of it. Watch the card fill in: the station's name — the
    PS, eight characters — a couple at a time, its programme type, and the RadioText scrolling
    beneath. This is PSK at work: a 57 kHz subcarrier whose phase flips nearly twelve hundred
    times a second to spell those letters.
  try: >-
    Your turn, comrade — watch the card assemble. RDS is slow, so give it a few seconds. Read the
    programme type and the RadioText. An empty card means this station sends no RDS or arrives too
    weak here; your strongest local station, the brightest stripe from Lesson 1, is the one to set
    (the quick-start shows how).
  predict: >-
    RDS hides its data in the carrier's phase — not its height or frequency. So does it turn up on
    the waterfall at all? Lock it in.
  observe: >-
    Look at the card against what a waterfall would have shown. On the waterfall this station is just a
    plain FM block — did any of this text ever appear there, in any lesson? And ask yourself the real
    question: if shifting phase changes neither height nor frequency, what instrument could ever have
    shown it to you?
  explain: >-
    Here's the straight answer: not at all — it is invisible there. A waterfall is built from one
    thing: how much energy sits at each frequency, moment to moment — amplitude across frequency.
    Phase-shift keying leaves both of those alone. It holds the frequency steady and the height steady
    and shifts only the phase, the exact timing of the wave's crossings. Two signals identical in
    height and frequency but half a cycle apart in phase look exactly the same on any waterfall, yet
    they carry opposite bits. A PSK signal still shows up as energy — a Wi-Fi signal is a plain
    20 MHz block — but never which phase, so never the bits. RDS hides twice over: its 57 kHz
    subcarrier rides inside the FM station's own block, flipping phase 1187.5 times a second to spell
    the station name and text, locked to the 19 kHz pilot so the receiver knows where each bit
    begins — and not one bit of it moves a pixel on this waterfall. To read phase you need a decoder
    that recovers the carrier's own reference and measures the shift against it, which is exactly
    what redsea did. And that is the quiet lesson of the whole unit: your eyes on the waterfall are a
    powerful instrument, but they see amplitude and frequency, never phase — and a whole class of
    signals, from this RDS to Wi-Fi to satellite downlinks, shows only a hump of energy, never the
    message. One honest footnote: reading a broadcaster's RDS is as ordinary as reading the station
    name off a car radio — it is public, meant to be seen. Next, you stop naming modulations and
    start turning signals into meaning: decoding, in earnest.

# Keyboard-free predict chips: {key, label}. None of these keys are YAML 1.1 booleans
# (yes/no/on/off/true/false), so they load as plain strings without needing quotes.
choices:
  - {key: shows, label: "A bright mark"}
  - {key: hidden, label: "Nothing at all"}
  - {key: faint, label: "A faint smear"}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: [hidden]
verdict: >-
  Nothing at all here: RDS rides a subcarrier inside the FM block, and a waterfall shows energy,
  never which phase.
