# ABOUTME: Lesson pack M12 "The Hidden Text" — PSK seen through RDS, data carried in the phase of an
# ABOUTME: FM subcarrier, invisible on the waterfall and read only with a decoder (rtl_fm|redsea).

id: 12
slug: rds
title: "The Hidden Text"
type: intro
concept: >-
  Phase-shift keying hides data in the timing of the wave — the phase — so a waterfall shows the
  signal's energy but never its bits. RDS is the
  everyday example: most FM stations flip the phase of a quiet 57 kHz subcarrier to carry their
  station name and scrolling text, and you read it only by decoding the phase. It closes the
  modulation unit: the shape your eyes can never see.
requires_tx: false
hardware: [rtl-sdr]
panels: [rds]
tune:
  center_hz: 106500000
  span_hz: 400000
  step_hz: 100000

stages:
  frame: >-
    Tonight, comrade, the subtlest trick yet. You have read a carrier by its height, its on and
    off, its pitch, its chirp. The last moves the timing of the wave itself — the phase. And it
    hides in plain sight: most FM stations you have tuned carry a stream of text in the phase of a
    quiet subcarrier, a second signal tucked inside the station's own. Tonight you read the words
    that were there all along.
  demo: >-
    Watch — hands off. redsea pulls a hidden 57 kHz PSK subcarrier from the FM station: station
    name (the PS, eight characters), programme type, and RadioText.
  try: >-
    Give the card a few seconds to assemble, comrade: RDS is slow. Read the programme type and the
    RadioText. Empty? Set your strongest station (the quick-start shows how).
  predict: >-
    RDS hides its data in the phase of a quiet subcarrier inside the station's signal. So does it
    turn up on the waterfall at all? Lock it in.
  observe: >-
    On a waterfall this station is a plain FM block — did this text ever appear there? If a
    waterfall shows energy but never phase, what instrument could show it?
  explain: >-
    A waterfall draws amplitude across frequency, moment to moment; it shows a PSK signal's energy,
    never which phase each bit took. Two signals
    half a cycle apart look identical yet carry opposite bits. RDS's 57 kHz subcarrier sends
    1187.5 bits a second, locked to the 19 kHz pilot so the receiver knows where each bit begins.
    Reading phase takes a decoder that recovers the carrier's reference and measures the shift, as
    redsea did. Broadcast RDS is public, as ordinary as a car radio's display. Carry this out the
    door: eyes see amplitude and frequency, never phase — Wi-Fi's plain 20 MHz block, RDS,
    satellite downlinks all show energy, never the message.

# Keyboard-free predict chips: {key, label}. None of these keys are YAML 1.1 booleans
# (yes/no/on/off/true/false), so they load as plain strings without needing quotes.
choices:
  - {key: shows, label: "A bright mark"}
  - {key: hidden, label: "Nothing at all"}
  - {key: faint, label: "A faint smear"}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: [hidden]
verdict: >-
  Nothing at all here: RDS rides a subcarrier inside the FM block, and a waterfall shows energy,
  never which phase.
