# ABOUTME: Lesson pack M15 "Not Meant for You" — POCSAG paging: the framing (cap code, kind, length,
# ABOUTME: baud) decoded live, the words withheld, and the federal law that puts them out of reach.

id: 15
slug: pocsag
title: "Not Meant for You"
type: intro
concept: >-
  POCSAG (in the US often its cousin FLEX) sends each page unencrypted: a cap code, then text or
  digits. On the commercial paging band federal law puts the words out of reach, so this console
  shows the framing live and withholds the text. Can versus may.
requires_tx: false
hardware: [rtl-sdr]
panels: [pocsag]
tune:
  center_hz: 929612500
  span_hz: 200000
  step_hz: 100000

stages:
  frame: >-
    A different kind of message tonight, comrade — one addressed to somebody else. Pagers still run
    the world's quiet corners: a hospital calling a doctor, a plant telling an engineer a pump has
    tripped. Each page carries a cap code — the address of one particular pager — then a short line
    of text or digits. On the waterfall it is a half-second buzz. Tonight you read its envelope, and
    learn what keeps the letter inside out of your hands.
  demo: >-
    Watch — hands off. rtl_fm listens on a 929 MHz paging channel and multimon-ng decodes each
    POCSAG burst. Each row is one page: the cap code it was sent to, its kind — text, digits or a
    bare tone — its length, and its speed: 512, 1200 or 2400 baud. Where the words would go, the row
    says withheld.
  try: >-
    Your log now, comrade. Pages come in bursts, so give it time. Read a row: which cap code, text or
    digits, how long, how fast? If the log stays empty, that's honest too: this channel may be quiet
    here, and many US carriers send FLEX, which this panel doesn't decode.
  predict: >-
    Each row shows a length where the words would be. What really stands between you and those
    words? Lock it in.
  observe: >-
    Look at a row against what the waterfall showed. The waterfall said "a burst near 929.6"; the
    decoder says "pager such-and-such was sent twenty characters." Was anything cryptographic in the
    way? If not, what is?
  explain: >-
    What keeps the words from you is federal law. POCSAG, from the 1980s, has no cipher:
    multimon-ng recovers the cap code, function code and every payload character, which is how
    the row knows the length. In the US a page is an "electronic communication" (18 USC
    2510(12)); only tone-only pages are carved out (2510(12)(B)). A page carried by a paging
    company does not count as "readily accessible to the general public" (2510(16)(D)), so the
    exception for listening to open radio does not reach it, and intentionally intercepting it —
    decoding the words — is itself the federal offence, up to five years in prison (2511(1)(a),
    2511(4)(a)). Passing on or using what you heard is a separate offence under the Communications
    Act (47 USC 605). That is why this console decodes the framing live and drops the text before
    it is stored, logged or shown. Carry this out the door: can versus may. Easy to decode says
    nothing about whether you may read; study the cap code and timing, the words are not yours.
    Next, back to the sky: ACARS, aircraft that send words.
# The closing line sets up M16 (ACARS aircraft text).

# Keyboard-free predict chips: {key, label}. None of these keys are YAML 1.1 booleans
# (yes/no/on/off/true/false), so they load as plain strings without needing quotes.
choices:
  - {key: encryption, label: "Encryption"}
  - {key: law, label: "The law"}
  - {key: signal, label: "A weak signal"}

# The predict asks what is true, not what the radio will show, so the reveal reads "In fact".
predict_kind: knowledge

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: [law]
verdict: >-
  The law: POCSAG carries no encryption, but intercepting a carrier's page is a federal offence
  (18 USC 2511).
