# ABOUTME: Lesson M21 "Slide It Down" — Unit 6 lesson 2 (no RF): mixing and downconversion. A local
# ABOUTME: oscillator multiplied with the RF keeps the difference, so tuning IS moving the LO; the image.

id: 21
slug: mixing-downconversion
title: "Slide It Down"
type: intro
concept: >-
  A mixer slides your signal down by multiplying it against the radio's own tone; tuning moves that tone.
requires_tx: false
hardware: []
panels: []

stages:
  frame: >-
    Last lesson the front-end lifted the faint RF clear of the noise, comrade. But it is still a wave
    wobbling a hundred million times a second, and the chip can count only a few million. So tonight:
    before you measure the wave, slow it down.
  demo: >-
    Multiply the antenna signal against a clean tone the radio makes itself — the local oscillator.
    Keep their difference, which lands low where the slow ADC can count it. To change stations you
    move only that oscillator: tuning is sliding the LO. That is the superheterodyne.
  try: >-
    The mixer is blunt, comrade: it keeps only the difference, which carries no sign. Park the LO at
    100.0 and a station at 100.1 lands at 0.1. Is 100.1 really the only signal that would land on that
    same spot?
  predict: >-
    LO parked at 100.0 MHz. A station at 100.1 lands at 0.1. Is a SECOND frequency landing on that
    same spot? Lock it in.
  observe: >-
    Hold your guess against the one rule: the mixer keeps the distance from the LO, nothing else. The
    LO sits at 100.0, and 100.1 is a tenth above. What else sits a tenth away — and could a blunt
    mixer tell them apart?
  explain: >-
    Yes, comrade — the image. A station at 99.9 is also a tenth from the LO, so it lands on 0.1 too,
    stacked under your signal: an unwanted ghost. The fix runs two mixers a quarter-turn apart —
    quadrature, I and Q — the next lesson.

# Keyboard-free predict chips: each a {key, label} — the key is what the commit records, the label is
# what the learner reads. Keys are quoted so a YAML-boolean word stays text, never True/False. Labels
# are one short phrase each (hard 800x480 console-fit).
choices:
  - {key: "image", label: "Yes — its mirror below the LO"}
  - {key: "unique", label: "No — only 100.1 lands there"}
  - {key: "harmonic", label: "Yes — a harmonic higher up"}
