# ABOUTME: Lesson M22 "Two Streams" — I/Q (quadrature) sampling (no RF): the dongle hands up two
# ABOUTME: streams a quarter-cycle apart, carrying phase as well as amplitude; 2.4 MSPS is a 2.4 MHz slice.

id: 22
slug: iq-sampling
title: "Two Streams"
type: intro
concept: >-
  The dongle hands up two streams, I and Q, whose phase tells signals above the tuning from below.
requires_tx: false
hardware: []
panels: []

stages:
  frame: >-
    All course, comrade, the waterfall has painted signals as colour across a band. But what is the
    dongle handing up to draw it? Not one stream of numbers. Two. See why there must be two, and the
    waterfall becomes arithmetic.
  demo: >-
    The radio measures each sample twice, a quarter-cycle apart: I and Q. One gives only amplitude;
    the pair gives phase. Picture a clock hand — I its shadow on the floor, Q on the wall. One shadow
    cannot tell which way it spins; two can, telling above from below.
  try: >-
    Your turn, comrade. Each complex pair lets the radio separate frequencies above and below where
    you tuned. The dongle takes 2.4 million pairs a second. So how wide a slice can it watch at once —
    and how does that compare to the waterfall?
  predict: >-
    Your dongle samples at 2.4 MSPS of I/Q. Tuned to 100 MHz, how wide a slice can you watch at
    once? Lock it in.
  observe: >-
    Hold your guess against what the complex pair bought you. A real-only stream wastes half its
    width on a mirror image it cannot read; I and Q together keep both halves. So ask yourself: does
    the slice reach only above the centre, or the same distance below it too?
  explain: >-
    2.4 MHz, comrade — the full rate, not half. A plain stream folds half back as a mirror, giving
    only 1.2 MHz; your complex I/Q pair resolves that mirror. So the slice runs the full 2.4 MHz, 1.2
    above your tuning and 1.2 below — the waterfall's width.

# The predict stage offers keyboard-free, tap-to-choose answers (no on-screen keyboard at the
# predict gate). Each is a {key, label}; keys are quoted so a YAML-boolean word stays text, and so
# the 1.2-vs-2.4 trap is settled by a tap, never a typed number.
choices:
  - {key: "half", label: "1.2 MHz — half the rate"}
  - {key: "full", label: "2.4 MHz — the full rate"}
  - {key: "point", label: "Only 100 MHz itself"}
