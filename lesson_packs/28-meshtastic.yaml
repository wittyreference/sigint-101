# ABOUTME: Lesson pack M28 "A Message That Hops" — the Meshtastic mesh/app layer above LoRa: nodes,
# ABOUTME: named channels, hop-limited routing and encrypted text, read off the Nomad's meshtasticd.

id: 28
slug: meshtastic
title: "A Message That Hops"
type: intro
concept: >-
  In Lesson 11 you read one LoRa packet off the air; Meshtastic is the network built on top of that
  radio. Nodes announce themselves, join named channels, and pass short encrypted text to each
  other — and a message hops node to node, each relay knocking down its hop limit, to reach a node
  far beyond your own range. meshtasticd already runs on the Nomad's LoRa radio; the lora panel lists
  what it received — each node the Nomad heard, the SNR it arrived at, and its text or an honest
  encrypted note — without ever touching the SDR.
requires_tx: false
hardware: [lora]
panels: [lora]

stages:
  frame: >-
    Lesson 11, comrade, you did the hard physics: you dug a single LoRa chirp out from under the
    noise and read one packet. Tonight you climb one floor up. That same radio does not just carry
    packets — it runs a network. Meshtastic: small nodes that find each other, join channels, and
    hand short encrypted messages down a chain until they reach someone no single node could hear
    alone. The chirp was the wire. This is what talks over it.
  demo: >-
    Watch — hands off. Not the SDR: the Nomad's LoRa radio runs meshtasticd, and the lora panel
    lists what it heard, as in Lesson 11. Each row: sender's node id, the SNR (often below the
    noise floor), and its text — or an honest "(encrypted — not on our channel)". Empty? A mesh of
    one hears nothing.
  try: >-
    Your turn, comrade — reading, not keying. Walk the list: text means the node shares LongFast,
    our default channel with a public key; "(encrypted — not on our channel)" is a real reception
    from another channel. The list stays empty until a second node sends on LongFast; add one
    when you can. How would a far node's text reach here?
  predict: >-
    A node too far to hear you directly, one node between. Does your text reach it, or die at your
    edge? Lock it in.
  observe: >-
    Hold your guess against the word "mesh." A mesh is not two radios shouting across a gap; it is
    many, each willing to repeat what it hears. If the node between you repeats your packet, where
    does it land — and what stops that repeat from echoing around the network forever?
  explain: >-
    Hop by hop: a node in between repeats it, and the far node hears that — the point of a mesh.
    Every relay knocks the hop limit (three by default) down by one; at zero, repeating stops, so
    the flood stays bounded, never an endless storm. A channel is a name and a key; LongFast's is
    the public default, so treat it as readable by anyone. Back to Lesson 11: routing needs no
    key, so a node with your radio settings relays a packet it cannot read. Carry this out the
    door: hearing, relaying and reading are three separate things. One node can't show a hop; with
    a third, a packet from beyond direct range is one the mesh relayed.

# Keyboard-free predict chips: {key, label}. Keys quoted so a YAML-boolean word stays text.
choices:
  - {key: "relayed", label: "Reaches it — relayed onward"}
  - {key: "dies", label: "Dies at your range"}
  - {key: "direct-only", label: "Only nodes you hear"}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: ["relayed"]
verdict: >-
  It reaches, relayed: the node between rebroadcasts it, and the hop limit (three by default) stops
  the echo.
