# ABOUTME: Lesson pack M1 "See the Invisible" — the first intro lesson; a radio signal is a
# ABOUTME: shape on the waterfall (frequency across, time down, brightness = power).

id: 1
slug: see-the-invisible
title: "See the Invisible"
type: intro
concept: >-
  A radio signal is a shape on a waterfall: frequency runs across, time runs down, and
  brightness is power.
requires_tx: false
hardware: [rtl-sdr]
panels: []

stages:
  frame: >-
    Radio is invisible, comrade, but tonight it stops being invisible to you — your very first skill
    is seeing a real signal as a shape on the screen, and every lesson after this one is just
    learning to read more shapes.
  demo: >-
    Watch — hands off for now. I sweep the FM band, 88 to 108 MHz, and tune the strongest
    station near you. There — that bright vertical stripe, about 200 kHz wide, is a radio
    station arriving right now. You are seeing radio. This picture is a waterfall, and it has
    three directions: left-to-right is frequency; top-to-bottom is time, the newest sliver at
    the top, scrolling down; brightness is power. That's the whole alphabet — frequency across,
    time down, brightness is power.
  try: >-
    Now it's your turn, comrade. From the stations I just scanned, tap a different strong one —
    any other bright stripe on the list. Watch the screen jump to it and a fresh stripe bloom
    where that station lives. That's it — you just tuned a radio. The only goal: make a station
    appear and put your finger on its stripe.
  predict: >-
    Next you'll tune two notches up the dial, to the station above the one you're on. First,
    commit to a guess: will that station's bright stripe be WIDER, NARROWER, or the SAME
    width as this one? Lock it in — the rest of the lesson stays hidden until you do.
  observe: >-
    Now tune two notches up the dial and hold the two stations side by side. Tell me what you
    actually see, not what you expected: which stripe is BRIGHTER — the stronger signal — and
    which is WIDER, or do the two look the same?
  explain: >-
    Here's what you were looking at. Every broadcast FM station is handed the same slice of
    the dial — about 200 kHz wide — so from one station to the next the stripe is the same
    width. That width is fidelity: a fat 200 kHz channel is what gives FM the room for full,
    stereo music, where a skinny voice channel would sound like a phone call. So width tells
    you the kind of signal, not which station it is. Brightness was still power — a closer or
    stronger transmitter paints a brighter stripe — and the vertical axis was still time, the
    signal scrolling downward as the seconds passed. Three axes, and you just read all three
    off a real station: frequency across, brightness is power, time goes down.

# The predict stage offers three keyboard-free, tap-to-choose answers (no on-screen keyboard
# at the predict gate). The loader parses and validates `choices` (key and label, fail-closed); it is carried here for the
# touch console. These stay neutral on purpose — the correct answer lives in `explain`, sealed
# behind the predict commit, so showing the choices never spoils the reveal.
choices:
  - label: Wider
    key: wider
  - label: Narrower
    key: narrower
  - label: Same
    key: same
