# ABOUTME: Lesson pack M1 "See the Invisible" — the first intro lesson; a radio signal is a
# ABOUTME: shape on the waterfall (frequency across, time down, brightness = power).

id: 1
slug: see-the-invisible
title: "See the Invisible"
type: intro
concept: >-
  A radio signal is a shape on a waterfall: frequency runs across, time runs down, and
  brightness is power.
requires_tx: false
hardware: [rtl-sdr]
panels: []

stages:
  frame: >-
    Radio is invisible, comrade, but tonight it stops being invisible to you — your very first skill
    is seeing a real signal as a shape on the screen, and every lesson after this one is just
    learning to read more shapes.
  demo: >-
    Watch — hands off for now. The screen sweeps the whole FM band, 88 to 108 MHz. That bright
    vertical stripe, about 200 kHz wide, is a radio station arriving right now. You are seeing
    radio. This picture is a waterfall: left-to-right is frequency; top-to-bottom is time, the
    newest sliver at the top; brightness is power. That's the whole alphabet.
  try: >-
    Now it's your turn, comrade. Tap a different bright stripe and the dial jumps to it, or step
    there with − and +. Read its frequency off the dial. That's it — you just tuned a radio.
  predict: >-
    Next you'll tune to the next bright stripe to the right. First, commit to a guess: will that
    station's stripe be WIDER, NARROWER, or the SAME width as this one? Lock it in — the rest of
    the lesson stays hidden until you do.
  observe: >-
    Now tune to the next bright stripe to the right and hold the two stations side by side. Tell
    me what you actually see, not what you expected: which stripe is BRIGHTER — the stronger
    signal — and which is WIDER, or do the two look the same?
  explain: >-
    Same width, station after station: broadcast FM hands every station an identical slice of
    the dial, about 200 kHz. A few stripes look twice as wide because HD Radio digital sidebands
    sit either side of the analog block. Why so fat? Width is fidelity — 200 kHz gives FM room
    for full stereo music, where a skinny voice channel would sound like a phone call. Brightness
    was still power, so a closer or stronger transmitter paints a brighter stripe, and the signal
    scrolled down as the seconds passed. Carry this out the door: three axes, read off a real
    station — frequency across, time down, brightness is power.

# The predict stage offers three keyboard-free, tap-to-choose answers (no on-screen keyboard
# at the predict gate). The loader parses and validates `choices` (key and label, fail-closed); it is carried here for the
# touch console. These stay neutral on purpose — the correct answer lives in `explain`, sealed
# behind the predict commit, so showing the choices never spoils the reveal.
choices:
  - label: Wider
    key: wider
  - label: Narrower
    key: narrower
  - label: Same
    key: same

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: [same]
verdict: >-
  Same: every FM station gets the same ~200 kHz slice, so width names the kind of signal, not
  the station.

# The post-lesson check: one new situation on this lesson's idea (a signal's shape names what it
# is), scored after the explain. Each chip's `why` is the feedback for choosing it.
check:
  prompt: >-
    One FM stripe is twice as wide as its neighbours: a bright core with a dimmer band hugging each
    side. What is it most likely?
  choices:
    - key: power
      label: A stronger station
      why: More power paints a brighter, slightly fuller stripe, never a dim band on each side.
    - key: hd
      label: An HD Radio station
      why: HD Radio adds digital sidebands either side of the analog core, doubling its width.
    - key: two
      label: Two stations side by side
      why: Two stations would show two bright cores, not one core with dim edges.
  answer: hd
