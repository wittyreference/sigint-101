# ABOUTME: Lesson pack M1 "See the Invisible" — the first intro lesson; a radio signal is a
# ABOUTME: shape on the waterfall (frequency across, time down, brightness = power).

id: 1
slug: see-the-invisible
title: "See the Invisible"
type: intro
concept: >-
  A radio signal is a shape on a waterfall: frequency runs across, time runs down, and
  brightness is power.
requires_tx: false
hardware: [rtl-sdr]
panels: []

stages:
  frame: >-
    Radio is invisible, but tonight it stops being invisible to you — your very first skill
    is seeing a real signal as a shape on the screen, and every lesson after this one is just
    learning to read more shapes.
  demo: >-
    Watch this — you don't touch anything yet. I'm going to sweep the FM broadcast band, 88
    to 108 MHz, and tune the strongest station near you. Give it a second... there. That
    bright vertical stripe, about 200 kHz wide, that just bloomed on the screen is a radio
    station arriving right now — you are seeing radio. This picture is called a waterfall, and
    it has exactly three directions worth knowing. Left-to-right is frequency: where on the
    dial a signal lives. Top-to-bottom is time: the newest sliver paints at the top and
    scrolls down, so the screen is the last few seconds of the air. Brightness is power: the
    brighter the paint, the stronger the signal. That's the whole alphabet — frequency across,
    time down, brightness is power.
  try: >-
    Now it's your turn. From the stations I just scanned, tap a different strong one — any
    other bright stripe on the list. Watch the screen jump to that frequency and a fresh
    ~200 kHz stripe bloom where that station lives. That's it: you just tuned a radio.
    Don't over-think the details yet — the only goal is to make a station appear and put your
    finger on its stripe.
  predict: >-
    You've now watched two FM stations bloom, and both looked about the same size. Before we
    go further, make a call about the next one. You're going to tune up the dial to the
    station two notches above the one you're on — but first, commit to a guess: will its
    bright stripe be WIDER, NARROWER, or the SAME width as the station you're looking at now?
    Lock in your answer — the rest of the lesson stays hidden until you do.
  observe: >-
    Go ahead and tune that station two notches up, and hold the two in your mind side by side.
    Tell me what you actually see, not what you expected: between this station and the one
    before it, which stripe is BRIGHTER — that's the stronger signal — and which stripe is
    WIDER, or do the two look the same?
  explain: >-
    Here's what you were looking at. Every broadcast FM station is handed the same slice of
    the dial — about 200 kHz wide — so from one station to the next the stripe is the same
    width. That width is fidelity: a fat 200 kHz channel is what gives FM the room for full,
    stereo music, where a skinny voice channel would sound like a phone call. So width tells
    you the kind of signal, not which station it is. Brightness was still power — a closer or
    stronger transmitter paints a brighter stripe — and the vertical axis was still time, the
    signal scrolling downward as the seconds passed. Three axes, and you just read all three
    off a real station: frequency across, brightness is power, time goes down.

# The predict stage offers three keyboard-free, tap-to-choose answers (no on-screen keyboard
# at the predict gate). The loader does not parse `choices` yet; it is carried here for the
# touch console. These stay neutral on purpose — the correct answer lives in `explain`, sealed
# behind the predict commit, so showing the choices never spoils the reveal.
choices:
  - label: Wider
    value: wider
  - label: Narrower
    value: narrower
  - label: Same
    value: same
