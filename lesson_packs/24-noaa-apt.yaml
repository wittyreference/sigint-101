# ABOUTME: Lesson pack M24 "A Picture From Space" — NOAA APT, the analog weather-satellite facsimile
# ABOUTME: on 137 MHz, decoded by satdump/aptdec into a cloud image of your own sky, line by line.

id: 24
slug: noaa-apt
title: "A Picture From Space"
type: intro
concept: >-
  A polar-orbiting weather satellite paints a picture of the clouds below it and sends it down on
  137 MHz as APT — Automatic Picture Transmission — an analog facsimile, not packets: a 2400 Hz tone
  whose loudness is pixel brightness, 120 lines a minute, two channels (visible and infrared) side by
  side. Because it is analog it degrades gracefully — a weak pass is grainy long before it is gone.
  No NOAA satellite has transmitted APT since August 2025 (NESDIS: NOAA-18 on 6 June, NOAA-19 on
  13 August, NOAA-15 on 19 August 2025): APT will be shown from a labelled recording (satdump,
  aptdec or noaa-apt), and the live 137 MHz pass will be Meteor-M N2-3 or N2-4 LRPT on 137.900 MHz
  once its decoder lands.
requires_tx: false
hardware: [rtl-sdr]
panels: [apt]
tune:
  center_hz: 137500000
  span_hz: 1000000
  step_hz: 100000
band_map:
  status: replay-only
  note: "NOAA APT off the air since August 2025"

stages:
  frame: >-
    Tonight, comrade, the radio looks up. Not at a tower or a plane but past them — at a satellite
    eight hundred kilometres over your head, falling around the Earth pole to pole, and for about a
    quarter of an hour it climbs your horizon, crosses your sky, and sets again. The whole time it is
    painting: a photograph of the clouds below it, sent down line by line as a plain tone on 137
    megahertz. A wire antenna and your dongle could catch it until 2025, and when the lines stacked
    up you held a picture of your own sky, taken from space. That is the prize.
  demo: >-
    Watch — hands off. APT on 137 megahertz is a 2400-hertz tone on an FM carrier: loudness is
    brightness, two lines a second. Empty? Honestly so — the end says why.
  try: >-
    Digital frames pass a checksum or vanish, comrade; APT has neither — just a tone whose
    loudness is a pixel. Buried in hiss, what does that picture do?
  predict: >-
    A weak, noisy pass, the tone buried in hiss. What does that leave you? Lock it in.
  observe: >-
    Past its error correction, a packet fails its checksum and is thrown away whole; APT has none.
    What does hiss do to a brightness — is a half-spoiled line lost?
  explain: >-
    A grainy but real image, comrade. APT is analog, so it fails gracefully: noise rides along as
    false brightness, and a weak pass comes down faded and speckled, banded with static where the
    signal dropped — yet real clouds over real coastline. Honest coda: no NOAA satellite has
    transmitted APT since August 2025 (NESDIS: NOAA-18 6 June, NOAA-19 13 August, NOAA-15 19 August
    2025), so none fills this panel. APT will be shown from a labelled recording; live passes will
    be Meteor-M LRPT on 137.900 MHz once its decoder lands. Carry this out the door: digital
    decoders behind you were all-or-nothing; analog gets noisier, then gone — and a picture shouted
    in the clear is yours to read.

# Keyboard-free predict chips: {key, label}. Keys quoted so a YAML-boolean word stays text.
choices:
  - {key: "none", label: "No image — just static"}
  - {key: "grainy", label: "A grainy but real picture"}
  - {key: "all-or-nothing", label: "Perfect or nothing, like packets"}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: ["grainy"]
verdict: >-
  A grainy but real picture: APT is analog, so noise speckles it; no checksum throws a line
  away.

