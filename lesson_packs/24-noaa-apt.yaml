# ABOUTME: Lesson pack M24 "A Picture From Space" — NOAA APT, the analog weather-satellite facsimile
# ABOUTME: on 137 MHz, decoded by satdump/aptdec into a cloud image of your own sky, line by line.

id: 24
slug: noaa-apt
title: "A Picture From Space"
type: intro
concept: >-
  A polar-orbiting weather satellite paints a picture of the clouds below it and sends it down on
  137 MHz as APT — Automatic Picture Transmission — an analog facsimile, not packets: a 2400 Hz tone
  whose loudness is pixel brightness, 120 lines a minute, two channels (visible and infrared) side by
  side. satdump decodes it live, or aptdec and noaa-apt decode a recorded pass, stacking the lines
  into an image of your own sky. Because it is analog it degrades gracefully — a weak pass is grainy,
  never simply gone. The catch: the NOAA APT birds were decommissioned in 2025, so a live image now
  means a transmitting satellite (Meteor-M N2-3 or N2-4 LRPT, near 137.9 MHz), a 137 MHz antenna
  and a timed pass.
requires_tx: false
hardware: [rtl-sdr]
panels: [apt]
tune:
  center_hz: 137500000
  span_hz: 1000000
  step_hz: 100000

stages:
  frame: >-
    Tonight, comrade, the radio looks up. Not at a tower or a plane but past them — at a satellite
    eight hundred kilometres over your head, falling around the Earth pole to pole, and for about a
    quarter of an hour it climbs your horizon, crosses your sky, and sets again. The whole time it is
    painting: a photograph of the clouds below it, sent down line by line as a plain tone on 137
    megahertz. A wire antenna and your dongle could catch it until 2025, and when the lines stacked
    up you held a picture of your own sky, taken from space. That is the prize.
  demo: >-
    Watch — hands off. The panel sits on the 137 megahertz polar weather-satellite band. APT is a
    facsimile, not packets: a 2400-hertz tone on an FM carrier whose loudness is brightness, two
    lines a second. The decoder stacks lines into two pictures, visible and infrared, sync stripes
    down each edge. The panel is empty, honestly; the end says why.
  try: >-
    Think it through, comrade. Every decoder so far was digital — aircraft position, ham packet,
    pager page, airliner message — each frame passing its checksum whole or vanishing. APT has no
    packets, no checksum: a tone whose loudness is a pixel. So when a low, faint satellite's tone
    comes in buried in hiss, what does that picture do?
  predict: >-
    A weak, noisy pass, the tone buried in hiss. Does that leave you no image, or a grainy but real
    one? Lock it in.
  observe: >-
    Hold your guess against how a facsimile differs from a packet, comrade. A packet with one
    flipped bit fails its checksum and is thrown away whole. A picture has no checksum; every
    moment of tone is a brightness, landing wherever the line has reached. Ask what hiss does to a
    brightness, and whether a half-spoiled line is a lost line.
  explain: >-
    A grainy but real image, comrade. APT is analog, so it fails gracefully: noise rides along as
    false brightness, and a weak pass comes down faded and speckled, banded with static where the
    signal dropped — yet real clouds over real coastline. Honest coda: NOAA-15 (137.620), NOAA-18
    (137.9125) and NOAA-19 (137.100) were decommissioned through 2025, the last that August. The
    panel stays empty until you aim a 137 megahertz V-dipole or quadrifilar helix at a predicted
    pass of a live bird: Russia's Meteor-M N2-3 or N2-4, near 137.9 MHz, sending digital LRPT.
    Carry this out the door: every digital decoder behind you was all-or-nothing; analog only gets
    noisier — and a picture shouted in the clear is yours to read.

# Keyboard-free predict chips: {key, label}. Keys quoted so a YAML-boolean word stays text.
choices:
  - {key: "none", label: "No image — just static"}
  - {key: "grainy", label: "A grainy but real picture"}
  - {key: "all-or-nothing", label: "Perfect or nothing, like packets"}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: ["grainy"]
verdict: >-
  A grainy but real picture: APT is analog, so noise only speckles it; no checksum throws a line
  away.
