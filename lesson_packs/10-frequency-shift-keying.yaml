# ABOUTME: Lesson pack M10 "The Carrier That Shifts" — frequency-shift keying, the carrier that never
# ABOUTME: goes off but hops between two tones, read with a decoder because the tones are too close to see.

id: 10
slug: frequency-shift-keying
title: "The Carrier That Shifts"
type: intro
concept: >-
  Frequency-shift keying keeps the carrier lit the whole time and moves it between two tones — a
  mark and a space — so the pattern of pitches carries the message, not the height or an on-off
  blink. The two tones sit too close to split on the waterfall, so you read FSK with a decoder,
  not the eye; it is the robust code many sensors speak — in the US mostly up at 915 MHz.
requires_tx: false
hardware: [rtl-sdr]
panels: [decode]
tune:
  center_hz: 433920000
  span_hz: 600000
  step_hz: 20000

stages:
  frame: >-
    Tonight, comrade, the carrier refuses to vanish. Last lesson it blinked flat off to send a bit;
    this one never switches off. Its trick sits too fine to tell by eye on this screen, so tonight
    you meet a new instrument: a decoder that reads it for you.
  demo: >-
    Watch — hands off for now. No waterfall tonight: rtl_433 listens on 433.92 again,
    demodulates each transmission and prints the device's make, its reading and the modulation.
    A cheap remote or doorbell reads ASK: one frequency switched on and off, last lesson's OOK.
    Some sensors read FSK, frequency-shift, and print two frequencies. You're reading a signal you
    cannot see.
  try: >-
    Your turn, comrade — eyes on the list, and be patient; a sensor chirps every minute or two.
    Sort the reads by modulation: ASK, one frequency, or FSK, two? For an FSK read, note how far
    apart its tones sit. All ASK is normal here: most US 433 MHz sensors are on-off keyed; FSK ones
    mostly live at 915.
  predict: >-
    An FSK sensor sends a bit, but unlike last lesson's OOK its carrier never switches off. So how
    does it carry that bit? Lock it in.
  observe: >-
    Find an FSK read in the list, eye on its two frequencies. Same number or two, and how far
    apart? Then ask why we trusted the decoder: if those tones sit tens of kHz apart, could a screen
    whose every bin — the slice of spectrum one pixel column sums — is 125 kHz wide ever show them
    as two?
  explain: >-
    A second frequency, carrier lit: which tone is sounding, mark or space, carries the bits.
    Nothing switches off, so FSK beats OOK in noise: interference can fake a blink, but hardly a
    clean jump between two set frequencies. So many sensors, especially at 915 MHz, speak FSK
    while the dollar-store doorbell speaks OOK. Those tones share one 125 kHz bin, below the
    screen's resolution; rtl_433 demodulates the shift at full resolution and prints the message,
    the temperature all along. Unit 2's rule stands: reading "eighteen degrees" is fine; acting on
    a device not yours is not. Carry this out the door: some signals you read by eye, some with a
    decoder — knowing which is half the craft.

# Keyboard-free predict chips: {key, label}. None of these keys are YAML 1.1 booleans
# (yes/no/on/off/true/false), so they load as plain strings without needing quotes.
choices:
  - {key: blink, label: "Blinks off"}
  - {key: height, label: "Changes height"}
  - {key: shift, label: "Shifts frequency"}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: [shift]
verdict: >-
  It shifts frequency: FSK keeps the carrier lit and hops it between a mark tone and a space tone.
