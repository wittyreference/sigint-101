# ABOUTME: Lesson pack M6 "Antennas Are Tuning Forks" — the resonance intro; an antenna rings only
# ABOUTME: near the frequency whose wavelength matches its length, and lambda(m)=300/f(MHz) sets it.

id: 6
slug: resonance
title: "Antennas Are Tuning Forks"
type: intro
concept: >-
  An antenna rings only near the frequency whose wavelength matches its length; the wrong length
  is deaf, and a quarter-wave in metres is 300 / f(MHz), then quartered.
requires_tx: false
hardware: [rtl-sdr]
panels: []

stages:
  frame: >-
    Tonight, comrade, you learn why the right antenna is not the biggest one: an antenna rings like a tuning
    fork — loud at one length, deaf everywhere else — and you are going to feel it happen under
    your own thumbs.
  demo: >-
    Watch — hands off for now. The stock whip is the same one that caught your first FM station —
    loud and bright on FM. Now I swap nothing and just tune up to 1090 MHz, where aircraft report
    their positions. Watch... almost nothing: same antenna, same sky, gone nearly deaf. Here's
    the whole idea — an antenna is a tuning fork: it rings, hears well, only near the frequency
    whose wavelength matches its length, and goes deaf off it. This whip was cut for FM, so at
    1090 it's the wrong length by a mile. One number gives the right length: a wavelength in metres
    is 300 over the frequency in MHz. At 100 MHz that's three metres; at 1090, about 0.28 —
    twenty-seven centimetres. An antenna likes a quarter of that: a leg just under seven
    centimetres, nowhere near this whip. That's why 1090 fell silent.
  try: >-
    Now your hands, comrade. Unscrew the whip and attach the kit's telescopic dipole, both legs
    stretched right out, long. Keep the radio on 1090: still almost nothing. Longer didn't help;
    "bigger" wasn't the answer. Now slide each leg inward, eye on the screen. Use the number — a
    quarter-wave at 1090 is just under seven centimetres, a thumb's length — and bring each leg to
    there. As you close in, faint returns prick up where the band was dead. No power, no knob: you
    tuned the antenna's note to the station's, with your thumbs.
  predict: >-
    You just shortened the legs to wake up 1090 MHz, and you've seen the number that sets length —
    300 over the frequency. The call: retune down to 915 MHz, where little wireless gadgets
    chatter. 915 is lower than 1090. To ring there, do the dipole legs need to get LONGER, get
    SHORTER, or stay the SAME? Lock it in — the rest stays hidden until you do.
  observe: >-
    Before you touch the legs, reason off the number and say what you expect: 300 divided by 915
    against 300 divided by 1090 — is the wavelength at 915 bigger or smaller? And so, to match it,
    should the legs grow or shrink from the thumb-length that just worked for aircraft?
  explain: >-
    Here's what you were feeling for with your thumbs. Frequency and wavelength sit on a seesaw: the
    number on top, 300, never moves, so when the frequency goes down the wavelength goes up, and when
    the frequency goes up the wavelength comes down. 915 is lower than 1090, so its wavelength is
    longer — 300 over 915 is about 0.33 metres against 0.28 at 1090 — and the quarter-wave legs that
    match it are longer too: roughly 8.2 centimetres instead of 6.9. So the honest answer is LONGER:
    to drop to a lower frequency you pull the legs out, not in. That is the whole trap inside "bigger
    is better." An antenna is not a bucket that catches more the larger it gets; it is a tuning fork
    that rings at one length and goes deaf off it, so the right antenna is simply the one cut to the
    frequency you want — too long is every bit as deaf as too short. You proved it both directions
    tonight: the FM whip was deaf at 1090 because it was far too long, and the dipole only woke up
    when you brought it to the length the number told you. Carry two things out the door: a
    quarter-wave in centimetres is 300 over the frequency in MHz, then quartered; and when a band
    sounds dead, ask whether your antenna is even the right length for it before you blame the sky or
    blame yourself.

# The predict stage offers keyboard-free, tap-to-choose answers (no on-screen keyboard at the
# predict gate). Each is a {key, label}: the key is what the commit records, the label is what the
# learner reads. They stay neutral on purpose — the correct answer lives in `explain`, sealed
# behind the predict commit, so showing the choices never spoils the reveal.
choices:
  - {key: longer, label: Longer}
  - {key: shorter, label: Shorter}
  - {key: same, label: Same length}
