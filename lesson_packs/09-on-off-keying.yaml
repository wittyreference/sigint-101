# ABOUTME: Lesson pack M9 "The Carrier That Vanishes" — on-off keying, the simplest modulation:
# ABOUTME: a carrier switched flat off and on, the message carried by the pattern of bursts and gaps.

id: 9
slug: on-off-keying
title: "The Carrier That Vanishes"
type: intro
concept: >-
  On-off keying is the simplest modulation there is — the carrier is switched all the way off and
  on, like a flashlight blinked in the dark, and the message is the pattern of the bursts and the
  gaps, not the height or the pitch. It is what the cheapest radios speak: doorbells, weather
  sensors and some remotes, crowding 433.92 MHz.
requires_tx: false
hardware: [rtl-sdr]
panels: []
tune:
  center_hz: 433920000
  span_hz: 2000000
  step_hz: 20000
  # 128 bins of 15.6 kHz rather than the default 16 of 125 kHz: the console keeps the carrier a
  # few bins off the hop's unmeasured centre, and with fine bins that offset is ~60 kHz, not 500.
  bin_hz: 15625

stages:
  frame: >-
    Tonight, comrade, you meet the simplest code on the air. Last lesson both carriers stayed lit
    through the quiet; this one does the opposite — it blinks all the way out and back, a flashlight
    signalling in the dark. Doorbells, cheap sensors, some remotes: much of 433 MHz speaks it.
  demo: >-
    Watch — hands off for now. We're on 433.92 MHz, where cheap sensors and some remotes chatter
    (most US car and garage remotes sit at 315 or 390 MHz). Keyed, a bright column stabs out of
    the noise, drops flat to the floor, then returns. Not dimming like AM: switching clean off.
    That rhythm is the whole message, like Morse.
  try: >-
    Your turn, comrade. Key a 433 MHz remote you own, a metre from the antenna, or wait for a
    neighbour's sensor (Flipper: Sub-GHz → Frequency Analyzer finds its frequency). Each press:
    does the line drop to the noise floor in the gaps, or does a ghost linger? Match the blinks to
    the bars and spaces in Sub-GHz → Read RAW.
  predict: >-
    The call is about the quiet between presses. When nothing is keyed at 433.92, what sits where the
    column was — a carrier still lit like AM's, the signal dropped to the noise floor, or a dim
    half-carrier? Lock it in.
  observe: >-
    Go back to 433.92 and watch one full press and release, eye on the column through the release. In
    the gap, is anything holding that spot, or is it just bare noise floor again? And ask yourself why
    that has to be so: if the carrier itself comes and goes, what is left to carry the message?
  explain: >-
    All the way down, as the last lesson promised. With no carrier half the time, the message
    can't ride height or pitch: it *is* the pattern of burst and gap lengths, Morse with a
    flashlight. So the cheapest hardware uses it: a remote just flicks a transmitter on and off, no
    fine modulation needed. The waterfall drew the blink in frequency, Read RAW as a pulse train in
    time: one event, two windows. Seeing blinks isn't reading them: turning a pattern into "unlock"
    or "ring the bell" is decoding, the next climb — under Unit 2's rule on whose remote you may
    lawfully decode. Carry this out the door: a column blinking clean off is OOK, anywhere on the
    dial.

# Keyboard-free predict chips: {key, label}. None of these keys are YAML 1.1 booleans
# (yes/no/on/off/true/false), so they load as plain strings without needing quotes.
choices:
  - {key: lit, label: "A lit carrier"}
  - {key: floor, label: "Down to the noise floor"}
  - {key: dim, label: "A dim half-carrier"}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: [floor]
verdict: >-
  Down to the floor: on-off keying switches the carrier fully off, so the gaps are bare noise.
