# ABOUTME: Lesson M17 "Who's Watching" — opens the counter-surveillance track (no RF): how ALPR
# ABOUTME: networks and cell-site simulators work, and the first law — no alert never means no camera.

id: 17
slug: watch-the-watchers
title: "Who's Watching"
type: intro
concept: >-
  Surveillance tech announces itself in the clear — ALPR cameras and fake cell towers both leak
  signatures you can detect passively — but a quiet detector never proves you are not being watched.
requires_tx: false
hardware: []
panels: []

stages:
  frame: >-
    Until now, comrade, you mostly turned the radio outward to hear what the world broadcasts.
    Tonight you turn it around and ask the harder question: who is listening to you? Two machines
    work your street. One reads every licence plate that rolls past and files where your car has
    been. The other pretends to be a phone tower so your phone will step up and say its name. You
    can learn to feel both of them in the air.
  demo: >-
    Start with the camera. An automated licence-plate reader — Flock is the common brand —
    photographs every plate, stamps it with time and place, and ships it to a searchable map of who
    went where. Wire dozens together and the map covers everyone, not just the wanted. It sends
    plates home over cellular, but it also carries a WiFi radio that chatters in the clear: a
    fingerprint you can recognise without ever touching the camera. The second machine is the
    cell-site simulator — a Stingray, an IMSI-catcher. It stands up a fake tower stronger than the real ones; your phone trusts it, hands
    over its permanent ID, and can be shoved down to flimsy old 2G where it is easy to track. You
    never agreed; it just happened. The counter-move for both is the move you already know: listen.
    Recognise the signature, do not transmit, do not interfere. But hold one hard truth close —
    detection is a guess, never a guarantee.
  try: >-
    Think it through before the next screen, comrade. Both machines leak something you can catch by
    listening alone — the camera's WiFi chatter, the fake tower's too-strong, too-pushy signal.
    Neither needs you to transmit a thing to find it. So here is the question the whole track turns
    on: if you listen for an hour and your detector stays dark, what exactly have you learned?
  predict: >-
    You drive an hour with your camera-detector running. It never once alerts. Does that prove the
    road you drove has no licence-plate readers on it? Lock it in.
  observe: >-
    Hold your guess against what a detector actually does. It watches certain signatures, on certain
    frequencies, only while it is switched on and listening. Ask yourself what a silent hour leaves
    out.
  explain: >-
    No, comrade: a quiet detector never proves absence, the first law of this whole track. It sees
    only signatures it was taught, on bands it watches, while it listens. A camera powered down, on
    a band you weren't watching, or wearing an uncatalogued fingerprint is invisible, and your
    silence is not its absence. No alert never means no camera. What detection buys is narrow but
    real: when a signature you DO know is on the air, you know. Carry this out the door: awareness,
    not safety; a reading, not a verdict. Next: a real Flock-camera detector on your own radio, then
    catching fake towers with a borrowed one — both receive-only. You watch the watchers; you never
    touch them.

