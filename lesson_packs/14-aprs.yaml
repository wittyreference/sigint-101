# ABOUTME: Lesson pack M14 "The Packet Has a Return Address" — APRS/AX.25 amateur packet on 2m,
# ABOUTME: decoded from AFSK1200 into a station's callsign, digipeater path, position and messages.

id: 14
slug: aprs
title: "The Return Address"
type: intro
concept: >-
  On the waterfall a 2m APRS burst is a half-second blip — but inside it is a fully framed packet.
  APRS rides AX.25, the amateur packet protocol: every transmission carries the sender's callsign,
  the list of digipeaters that relayed it, and a payload that is often a position, a short message or
  a status, all in the clear. multimon-ng demodulates the AFSK1200 tones and unpacks the frame, and
  the console lists each station with what it last said. This is decode in earnest: a signal with a
  return address.
requires_tx: false
hardware: [rtl-sdr]
panels: [aprs]
tune:
  center_hz: 144390000
  span_hz: 200000
  step_hz: 100000

stages:
  frame: >-
    Another signal to read, comrade, and this one announces itself. Up on 2 metres, 144.390, radio
    amateurs run a packet network called APRS: little bursts of data a half-second long, each one
    carrying a station's callsign, the path it took to reach you, and usually where that station is
    standing — latitude and longitude — or a short message to someone. On the waterfall it is a blip
    you would never look twice at. Decoded, it is a postcard with a return address. Tonight you read
    the mail.
  demo: >-
    Watch — hands off. No waterfall; a burst is just a flick there. rtl_fm listens on 144.390;
    multimon-ng turns the AFSK tones (Bell 202: 1200 and 2200 Hz, 1200 bits a second) into AX.25
    frames. Each roster row: a licensed callsign-SSID (-9 means mobile), the digipeaters that relayed
    it, then a position, status or message. Amateur radio: public by law.
  try: >-
    Your roster now, comrade. APRS is bursty — a station beacons every minute or few — so give it
    time. Read a row: who sent it and what it carried; a position becomes latitude and longitude, a
    message shows who it was for. You're not naming a modulation any more: you're reading a framed
    message, return address and all.
  predict: >-
    A 2m APRS burst is a half-second blip on the waterfall. Decoded, what is inside it — a framed
    packet, or just a tone? Lock it in.
  observe: >-
    Look at a row. The waterfall said "a brief signal at 144.39"; the decoder says "this licensed
    station, relayed by these digipeaters, is standing here and said this." How much of that
    structure was in the air all along, waiting for something that knew the frame? And an empty
    roster: a failing decoder, or no one beaconing in range?
  explain: >-
    A structured packet. APRS speaks AX.25, amateur radio's packet link protocol; every frame has
    one skeleton: source callsign and SSID, destination, digipeater path and an information field
    whose first character says what follows: a position (often with a comment), a message, or a
    status. multimon-ng recovers the tones and HDLC framing, checks the CRC so a corrupted burst is
    dropped, never shown wrong, and hands up the clean TNC2 line behind each row. Open by design:
    amateur radio may not be encrypted, so it's all meant to be heard. Carry this out the door: a
    waterfall sees a signal exists; a decoder knowing the frame sees what it says. Next: a message
    sent as openly, but not meant for you.
# The closing line sets up M15 (POCSAG pagers): sent in the clear, but not addressed to you.

# Keyboard-free predict chips: {key, label}. None of these keys are YAML 1.1 booleans
# (yes/no/on/off/true/false), so they load as plain strings without needing quotes.
choices:
  - {key: framed, label: "A framed packet"}
  - {key: blip, label: "Just a tone"}
  - {key: scrambled, label: "Scrambled data"}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: [framed]
verdict: >-
  A framed packet: every APRS burst is an AX.25 frame with a callsign, a relay path and a
  payload, all in the clear.
