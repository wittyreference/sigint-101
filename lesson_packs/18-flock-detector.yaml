# ABOUTME: Lesson M18 "The Camera's Fingerprint" — build the Flock ALPR detector on nomad-b's own
# ABOUTME: WiFi radio in monitor mode: recognise the camera by its MAC OUI + probe-request IE order.

id: 18
slug: flock-detector
title: "The Camera's Fingerprint"
type: intro
concept: >-
  Last lesson named the counter-surveillance track's first law; this one builds the detector that
  obeys it. A Flock ALPR camera sends its plates home over cellular, but it also carries a WiFi
  radio that leaks a fingerprint — its MAC OUI plus the order of Information Elements in the 802.11
  probe requests it sends in the clear. A USB WiFi adapter in monitor mode overhears those management frames and
  matches the shape, strictly receive-only. Recognition is tiered: a bare OUI is a weak hint, OUI
  plus the exact IE fingerprint a strong hit. And the first law still holds — no alert never means
  no camera.
requires_tx: false
hardware: [wifi-monitor]
panels: [flock]

stages:
  frame: >-
    Last lesson, comrade, you learned the first law: a quiet detector never proves absence. Tonight
    you earn the other half of that bargain — you build the detector itself, and learn exactly what
    it can and cannot see. The Flock camera on the pole ships its plates home over cellular, but it
    also carries a WiFi radio, and that radio, like every WiFi radio, announces itself as it probes
    for networks. You will not
    touch the camera. You will not transmit a thing. You will only listen to what it is already
    saying to the air.
  demo: >-
    Watch — hands off. A plain USB WiFi adapter, not the SDR, sits in monitor mode, overhearing
    the 802.11 probes and beacons every device shouts in the clear. Each row is one: its OUI, the
    MAC half naming the maker; its Information Element order, the capabilities it lists; sometimes
    a network it hunts. All matched against a Flock camera's shape.
  try: >-
    Your watch, comrade. Let it listen; frames come in bursts as devices wake, probe and fall
    quiet. On a flagged row: what maker does the OUI name, and did the whole fingerprint match
    or only the prefix? You read metadata, who speaks and how, never payload or pictures. You
    never answer, associate or transmit; the camera never knows you exist.
  predict: >-
    A device trips your detector: a known Flock MAC prefix, but the IE fingerprint doesn't match.
    How sure are you it's a camera? Lock it in.
  observe: >-
    Weigh what actually fired against what did not. The maker prefix is shared across a whole product
    line, and more than one kind of gadget can wear a radio from the same batch; the fingerprint is
    the finer thing. Ask yourself which half of the match carries the weight, and what a half-match
    honestly earns.
  explain: >-
    A weak hint, comrade, not a camera. Recognition comes in tiers: a bare OUI says only that a
    maker Flock also buys from built the radio — a family name, nothing to stand behind. The
    strong hit adds the exact order of Information Elements in a probe request, with a "Flock-"
    network name as a bonus. A half-match is a lead to watch, not a verdict. Your radio sees only
    the signatures it was taught, on 2.4 gigahertz, when a device probes; a camera powered down,
    on another channel, or on firmware that reorders its elements is invisible. Carry this out the
    door: no alert never means no camera — awareness, real but narrow; a reading, never a
    guarantee.

# Keyboard-free predict chips: {key, label}. Keys quoted so a YAML-boolean word stays text.
choices:
  - {key: "weak-hint", label: "Weak hint only"}
  - {key: "strong-hit", label: "Strong, likely a camera"}
  - {key: "certain", label: "Certain it's a camera"}

# The predict asks what is true, not what the radio will show, so the reveal reads "In fact".
predict_kind: knowledge

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: ["weak-hint"]
verdict: >-
  A weak hint: the prefix names a maker shared by many gadgets; only the full IE fingerprint is a
  strong hit.
