# ABOUTME: Lesson pack M3 "Know Your Instrument" — the baseline intro; a deaf receiver and a quiet
# ABOUTME: band draw the same waterfall, and only a baseline against a known reference tells them apart.

id: 3
slug: baseline
title: "Know Your Instrument"
type: intro
concept: >-
  A receiver can go deaf and look identical to a quiet band; only a baseline against a known
  reference catches it.
requires_tx: false
hardware: [rtl-sdr]
panels: [provenance]

stages:
  frame: >-
    Tonight, comrade, you learn the most unsettling way a radio can fail — quietly — and the one
    plain habit that catches it.
  demo: >-
    Watch — hands off for now. The boring move is the whole job: write down the state of the
    instrument itself. The provenance panel shows the radio, not a signal: its gain, its chip
    temperature, whether its power is clean, and the level of a known reference — a steady FM
    station the console watches, set for your area. Capture it and you hold tonight's baseline.
  try: >-
    Now you capture yours, comrade. Tap Capture baseline — that stamps tonight's record: the
    radio, its settings, its temperature, the reference level. The lesson is in the repeat: do
    it again tomorrow, and the night after.
  predict: >-
    You've saved a baseline. Weeks from now this receiver slowly goes deaf — a corroded
    connector, a dying front end (the first amplifier behind the antenna). Next to a band merely
    quiet tonight, would its picture look IDENTICAL, a LITTLE different, or OBVIOUSLY different?
    Lock it in.
  observe: >-
    Imagine this radio goes deaf tonight. From the waterfall alone — grass, dark, flat floor —
    could you tell? Which number on the provenance panel would tell you?
  explain: >-
    Here's the hard truth you just reasoned your way toward. A dead front end and an empty sky draw
    the same waterfall — flat floor, no stripes, nothing at all. "Quiet band" and "deaf radio" are
    indistinguishable from the picture alone, which means a blank waterfall never, on its own,
    proves that nothing is on the air; it can just as easily mean this radio has stopped hearing.
    The only thing that resolves it is the reading you captured tonight: the reference. If your
    known station still sits at the level your baseline recorded, the radio is healthy and the band
    is genuinely quiet. If that reference has dropped or vanished while nothing else changed, the
    radio has gone deaf — and you would never have known without the baseline to compare against.
    That is why you logged the radio, the gain, the temperature, the power: that context is
    provenance, and provenance is what makes one reading comparable to the next. A number on the
    screen is not ground truth; a number sitting beside the known-good baseline that produced it is.
    Keep the baseline, trust the reference, and the instrument cannot go deaf on you without getting
    caught.

# The predict stage offers keyboard-free, tap-to-choose answers (no on-screen keyboard at the
# predict gate). Each is a {key, label}: the key is what the commit records, the label is what the
# learner reads. They stay neutral on purpose — the correct answer lives in `explain`, sealed
# behind the predict commit, so showing the choices never spoils the reveal.
choices:
  - {key: identical, label: Identical}
  - {key: little, label: A little different}
  - {key: obvious, label: Obviously different}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: [identical]
verdict: >-
  Identical: a deaf radio and an empty band draw the same picture; only the reference against
  your baseline tells them apart.
