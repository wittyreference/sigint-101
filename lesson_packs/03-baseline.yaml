# ABOUTME: Lesson pack M3 "Know Your Instrument" — the baseline intro; a deaf receiver and a quiet
# ABOUTME: band draw the same waterfall, and only a baseline against a known reference tells them apart.

id: 3
slug: baseline
title: "Know Your Instrument"
type: intro
concept: >-
  A receiver can go deaf and look identical to a quiet band; only a baseline against a known
  reference catches it.
requires_tx: false
hardware: [rtl-sdr]
panels: [provenance]

stages:
  frame: >-
    Tonight, comrade, you learn the most unsettling way a radio can fail — quietly — and the one
    plain habit that catches it.
  demo: >-
    Watch — hands off for now. The boring move is the whole job: record the instrument itself.
    The provenance panel shows the radio, not a signal: its gain, chip temperature, whether its
    power is clean, and the level of a known reference — a steady FM station the console watches,
    set for your area. Capture it: that's tonight's baseline.
  try: >-
    Now you capture yours, comrade. Tap Capture baseline — that stamps tonight's record: the
    radio, its settings, its temperature, the reference level. The lesson is in the repeat: do
    it again tomorrow, and the night after.
  predict: >-
    Two pictures of the same empty stretch of band, comrade: one from a healthy radio, one from a
    radio whose antenna cable has corroded through. From the pictures alone, could you tell which
    radio is deaf? Lock it in.
  observe: >-
    Imagine this radio goes deaf tonight. From the waterfall alone — grass, dark, flat floor —
    could you tell? Which number on the provenance panel would tell you?
  explain: >-
    They look alike: this screen rescales its colours to whatever noise reaches it, so a deaf
    radio and an empty sky both paint plain grass. A blank waterfall alone never proves the air is
    empty. Your reference settles it. If your known station holds its baseline level, the radio is
    healthy and the band is quiet; if it has dropped or vanished while nothing else changed, the
    radio has gone deaf. That's why you logged radio, gain, temperature and power: that context is
    provenance, making one reading comparable to the next. Carry this out the door: a number on
    the screen is not ground truth; a number beside its known-good baseline is — keep the
    baseline, trust the reference.

# The predict stage offers keyboard-free, tap-to-choose answers (no on-screen keyboard at the
# predict gate). Each is a {key, label}: the key is what the commit records, the label is what the
# learner reads. They stay neutral on purpose — the correct answer lives in `explain`, sealed
# behind the predict commit, so showing the choices never spoils the reveal.
choices:
  - {key: glance, label: "Yes, at a glance"}
  - {key: dimming, label: Only by a faint dimming}
  - {key: alike, label: "No, they look alike"}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: [alike]
verdict: >-
  They look alike: the screen rescales its colours to whatever noise it gets, so a deaf radio
  paints the same grass. Only your reference tells.

# The post-lesson check: one new situation on this lesson's idea (only the reference against your
# baseline tells a deaf radio from a quiet band), scored after the explain. Each chip's `why` is the
# feedback for choosing it.
check:
  prompt: >-
    Your target band looks empty tonight. Your FM reference sits 15 dB under its baseline, same
    gain, same temperature. Likeliest verdict?
  choices:
    - key: deaf
      label: Your radio went deaf
      why: A steady station 15 dB down, with gain and temperature unchanged, puts the loss in your radio.
    - key: quiet
      label: The band is just quiet
      why: A quiet band leaves your reference at baseline; yours dropped 15 dB.
    - key: unknown
      label: Can't tell from this
      why: The picture alone can't, but your reference can; 15 dB under baseline is the tell.
  answer: deaf
