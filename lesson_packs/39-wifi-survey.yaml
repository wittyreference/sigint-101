# ABOUTME: Lesson pack M39 "Envelopes, Not Letters" — read-only Wi-Fi metadata census by channel
# ABOUTME: and the Joffe v. Google line between broadcast metadata and protected Wi-Fi payload.

id: 39
slug: wifi-survey
title: "Envelopes, Not Letters"
type: consolidation
concept: >-
  A Wi-Fi survey counts networks from broadcast metadata alone — channel, SSID, BSSID, signal and
  security — and stops before payload, which federal law protects even on open Wi-Fi.
requires_tx: false
hardware: [wifi]
panels: [survey]

stages:
  predict: >-
    An open Wi-Fi network down the street carries no encryption. Where does federal law draw the
    line on what you may read from it? Lock it in.
  operate: >-
    Run one read-only scan: nmcli lists each access point's channel, SSID, BSSID, signal and
    security. No connection, and no payload column exists here.
  observe: >-
    Count the networks per channel: which channels crowd, which hide an SSID, which run open?
    Every row stays on the envelope — never what rides inside.
  explain: >-
    Metadata only, comrade — never payload. Access points broadcast beacons with channel, SSID,
    BSSID, signal and security so devices can find them; this scan reads only those envelopes and
    never connects. Payload — emails, passwords, web traffic — sits across the legal line even on
    open Wi-Fi. In Joffe v. Google, Inc., 746 F.3d 920 (9th Cir. 2013), the Ninth Circuit held
    that unencrypted Wi-Fi payload data is neither a "radio communication" under 18 USC 2510(16)
    nor "readily accessible to the general public" under 18 USC 2511(2)(g)(i), so intercepting it
    violates the Wiretap Act. Carry this out the door: count the envelopes, keep the letters
    shut — the panel has no payload field by design.

# Keyboard-free predict chips: {key, label}. Lengths stay within 2x and none are YAML booleans.
choices:
  - {key: "everything", label: "Everything unencrypted"}
  - {key: "envelope-only", label: "Metadata, never payload"}
  - {key: "nothing", label: "Nothing over Wi-Fi"}

# The predict asks where the law draws the line, so the reveal reads "In fact".
predict_kind: knowledge

# The scored gate: single key, one-line verdict under 150 chars.
answer: ["envelope-only"]
verdict: >-
  Metadata, never payload: open Wi-Fi beacons announce networks, but intercepting payload data
  breaks the Wiretap Act (Joffe v. Google).

