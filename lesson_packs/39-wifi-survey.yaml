# ABOUTME: Lesson pack M39 "Envelopes, Not Letters" — read-only Wi-Fi metadata census by band and
# ABOUTME: channel, and the amended Joffe v. Google holding on Wi-Fi payload under 18 USC 2510(16).

id: 39
slug: wifi-survey
title: "Envelopes, Not Letters"
type: consolidation
concept: >-
  A Wi-Fi survey counts networks from cached broadcast metadata alone — band, channel, SSID, BSSID,
  signal and security — and stops before payload, which Joffe v. Google (9th Cir.) excluded from
  the Wiretap Act's unencrypted-radio definition.
requires_tx: false
hardware: [wifi]
panels: [survey]

stages:
  predict: >-
    An open Wi-Fi network has no encryption. Under Joffe v. Google (9th Cir.), does that make its
    payload exempt radio — and where does this panel stop? Lock it in.
  operate: >-
    Read NetworkManager's cached Wi-Fi list (--rescan no): band, channel, SSID, BSSID, signal and
    security. No scan request, no connection, and no payload column.
  observe: >-
    Count the networks by band and channel: which bands and channels crowd, which hide an SSID,
    which run open? Every row stays on the envelope — never payload.
  explain: >-
    Metadata only, comrade — never payload. This panel reads NetworkManager's cached beacon
    metadata (band, channel, SSID, BSSID, signal, security). On payload, the Ninth Circuit's
    amended opinion in Joffe v. Google, Inc., 746 F.3d 920 (9th Cir. 2013), is narrow: Wi-Fi
    payload — emails, passwords, images, documents — is not a "radio communication" (a
    predominantly auditory broadcast) under 18 USC 2510(16), so the unencrypted-radio rule does
    not bring it into the 18 USC 2511(2)(g)(i) exemption. That appeal reviewed the denial of
    Google's motion to dismiss, so the Wiretap Act claim survived at the pleading stage without
    deciding liability; it binds only the Ninth Circuit (certiorari was denied and the suit
    settled; no other circuit had ruled as of 2026), and never decided whether reading beacon
    metadata is lawful. Outside the Ninth Circuit the payload question is open, not cleared: the
    Act's default, 18 USC 2511(1)(a), forbids intentionally intercepting an electronic communication
    unless an exemption applies. Carry this out the door: count the envelopes, keep the letters
    shut — this panel has no payload field by design.

# Keyboard-free predict chips: {key, label}. Lengths stay within 2x and none are YAML booleans.
choices:
  - {key: "everything", label: "Open Wi-Fi payload is exempt radio"}
  - {key: "envelope-only", label: "Payload is not radio; scan metadata"}
  - {key: "nothing", label: "No Wi-Fi signal may be received"}

# The predict asks what the Ninth Circuit held and where this panel stops, so the reveal reads "In fact".
predict_kind: knowledge

# The scored gate: single key, one-line verdict under 150 chars.
answer: ["envelope-only"]
verdict: >-
  Payload is not "radio communication" under 18 USC 2510(16) (9th Cir.); Joffe left beacons
  undecided, and this panel stops at metadata.

