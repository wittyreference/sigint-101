# ABOUTME: Lesson pack M4 "The Number on the Dial" — the ppm-error intro; the built-in radio has a
# ABOUTME: large known frequency error, measured off a station's pilot, and cured by telling each tool.

id: 4
slug: ppm-error
title: "The Number on the Dial"
type: intro
concept: >-
  The built-in radio has a large, known frequency error (well over a hundred ppm) that drifts as
  the Pi warms; you measure it against a broadcaster's 19 kHz pilot, and the cure is telling each
  tool its error with -p or --ppm.
requires_tx: false
hardware: [rtl-sdr]
panels: [ppm]

stages:
  frame: >-
    Tonight, comrade, you meet the lie your built-in radio tells on every frequency — a big, known
    error baked into its cheap clock — and you measure it against a landmark the broadcaster keeps
    honest for you.
  demo: >-
    Watch — hands off for now. Every stereo FM station hides a steady 19 kHz tone, the pilot,
    inside its audio, held to within 2 Hz by FCC rule. The ppm panel times that tone against this
    radio's clock. The radio this course was built on read about +164 ppm: 164 Hz of error for
    every MHz you tune.
  try: >-
    Your turn. Step the dial to your strongest station with − and +, then tap Measure ppm. Expect
    a number in the low hundreds. At +164, 100 MHz lands about 16 kHz high — nothing inside a
    200 kHz FM channel, which is why you never noticed. "No pilot" means mono or too weak: pick a
    stronger station.
  predict: >-
    Say your radio sits about 16 kHz high at 100 MHz. Up at 1090 MHz — where aircraft report their
    positions — will its error in kHz be BIGGER, about the SAME, or SMALLER? Lock it in — the rest
    stays hidden until you do.
  observe: >-
    Reason from the one number you have, then say what you expect: at 1090 MHz — about eleven
    times higher than that FM station — how far off would the built-in radio land, and would that
    error still tuck inside a channel or throw you clean off the signal?
  explain: >-
    Bigger, about elevenfold: one cheap crystal sets every frequency, so the ppm holds everywhere
    and the kHz grow with it. Width decides if it hurts. ADS-B, 2 MHz wide, shrugs it off — its
    transmitters may sit 1–3 MHz off, and dump1090 samples 2.4 MHz — but at 162 MHz it's 27 kHz,
    past an AIS channel; at 450 MHz, 74 kHz, several DMR channels. Narrow signal off its listed
    frequency? Suspect this, not yourself or the device. Carry this out the door: tell each tool
    your measured number — `rtl_fm -p 164`, `rtl_433 -p 164`, `dump1090-fa --ppm 164`. This
    console doesn't apply it yet; its PPM RAW chip says so. The kit's 1 ppm V3 would read near
    zero.

# The predict stage offers keyboard-free, tap-to-choose answers (no on-screen keyboard at the
# predict gate). Each is a {key, label}: the key is what the commit records, the label is what the
# learner reads. They stay neutral on purpose — the correct answer lives in `explain`, sealed
# behind the predict commit, so showing the choices never spoils the reveal.
choices:
  - {key: smaller, label: Smaller}
  - {key: same, label: About the same}
  - {key: bigger, label: Bigger}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: [bigger]
verdict: >-
  Bigger: ppm scales with frequency, so +16 kHz at 100 MHz is about +179 kHz at 1090 MHz.
