# ABOUTME: Lesson pack M23 "What Every Pixel Is" — the capstone of the instrument unit (no RF):
# ABOUTME: sampling, the Nyquist theorem, aliasing, and the FFT that turns I/Q blocks into the waterfall.

id: 23
slug: every-pixel
title: "What Every Pixel Is"
type: intro
concept: >-
  Sampling, Nyquist, and the FFT turn a stream of I/Q numbers into every pixel of the waterfall.
requires_tx: false
hardware: []
panels: []

stages:
  frame: >-
    The last lesson, comrade: tonight you turn the radio on itself. All course you trusted the
    waterfall but never asked what it is. Tonight you find out — what one pixel really is, built from
    three ideas: sampling, Nyquist, and the FFT.
  demo: >-
    Three moves, comrade. Sampling: the radio reads the wave on a clock, two numbers a tick — I and
    Q. Nyquist: the rate sets the window, 2.4 MSPS giving a 2.4 MHz slice. The FFT turns each block
    into one line; stack the lines and you have the waterfall.
  try: >-
    You have the three moves, comrade. But a window has edges — your 2.4 MHz slice stops somewhere,
    and the spectrum out there does not. A real, strong signal sits just past that edge. Does that
    mean it is not in your picture?
  predict: >-
    A strong signal sits just past the top edge of your sampled window, unfiltered. On the waterfall —
    gone, true spot, or ghost? Lock it in.
  observe: >-
    Hold your guess against one fact, comrade: energy does not know where you drew your edges. The
    sampler ticks at its fixed rate no matter what arrives. So a wave wiggling faster than your ticks
    — what does it look like?
  explain: >-
    A ghost, comrade — aliasing. A signal past half your rate folds back and paints a false line at
    the wrong frequency, so every receiver filters it out first. Now the payoff: every pixel is an FFT
    number — place is frequency, colour is energy, row is time.

# Keyboard-free predict chips: {key, label}. Keys quoted so a YAML-boolean word stays text, and so
# each chip's tap records a plain string. Labels kept to one short phrase for the 800x480 console.
choices:
  - {key: "vanishes", label: "Gone — it's out of band"}
  - {key: "true-spot", label: "Shows at its true frequency"}
  - {key: "aliases", label: "A ghost at the wrong spot"}
