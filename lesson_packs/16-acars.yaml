# ABOUTME: Lesson pack M16 "What the Aircraft Says" — ACARS, the typed messages aircraft send over
# ABOUTME: VHF, decoded with acarsdec into a registration, a flight number and the message text.

id: 16
slug: acars
title: "What the Aircraft Says"
type: intro
concept: >-
  In Lesson 13 you watched aircraft broadcast where they are. ACARS is how they broadcast what they
  are saying: a VHF data link, around 131 MHz, carrying typed messages between the plane and its
  airline — position and weather reports, fuel and engine data, gate and delay notices, even free
  text to the crew. acarsdec demodulates the burst and reads the fields, and the console lists each
  message by the aircraft that sent it: from a signal's shape, to its position, to its words.
requires_tx: false
hardware: [rtl-sdr]
panels: [acars]
tune:
  center_hz: 131550000
  span_hz: 200000
  step_hz: 100000

stages:
  frame: >-
    Another signal, comrade, and it adds words to the story. Back in Lesson 13 the aircraft told you
    where they were. Tonight they tell you what they are saying. ACARS is the airlines' own
    text-message system, sent over VHF around 131 megahertz: short typed bursts between an aircraft
    and its company — a position report, a weather readback, an engine reading, a note to the crew
    about a gate change. On the waterfall it is a quarter-second buzz. Decoded, it is the aeroplane
    talking, in words.
  demo: >-
    Watch — hands off. acarsdec opens the radio on 131.550, one of North America's busiest ACARS
    channels. Each row is one message: the registration (its painted tail number), the flight
    number, a label coding what kind of message it is, and any text it carried. Some are wordless
    handshakes; others are operational data or plain English.
  try: >-
    Your log now, comrade. ACARS arrives in bursts as aircraft pass and check in; give it time and
    watch tail numbers arrive. Read a message: which aircraft, and what it said — some rows terse
    codes, some readable text. Sit with how far this unit has come: from naming a signal's shape to
    reading what an aircraft told its airline.
  predict: >-
    An ACARS burst is a quarter-second buzz on the waterfall. Decoded, what is inside — readable
    airline text, or encrypted ops data? Lock it in.
  observe: >-
    Look at a message against this unit. Lesson 13's scope said "this aircraft is here"; this log
    says "this aircraft said this." The same waterfall that once only showed a signal existed now
    feeds decoders reading positions, station names, packets, pages and typed aircraft messages.
    What changed — the radio, or what you knew to do with what it heard?
  explain: >-
    Readable, mostly, because nothing hid it. ACARS, Aircraft Communications Addressing and
    Reporting System, is a 1970s VHF data link whose common form is not encrypted. Each message
    holds a registration, a label naming its type, a block and sequence number, and often a body: a
    position or weather report, an engine or fuel reading, an ops notice, sometimes plain English to
    the crew. acarsdec recovers and checks each burst; listening to an aeronautical system is lawful
    (18 USC 2511(2)(g)(ii)(IV)). Terse isn't secret: not every row reads as a sentence. Carry this
    out the door: a receiver hears energy; a decoder that knows the format turns it into meaning,
    with can-versus-may riding along. Next: ships, then digital voice.

# Keyboard-free predict chips: {key, label}. None of these keys are YAML 1.1 booleans
# (yes/no/on/off/true/false), so they load as plain strings without needing quotes.
choices:
  - {key: encrypted, label: "Encrypted ops data"}
  - {key: telemetry, label: "Only raw numbers"}
  - {key: text, label: "Readable airline text"}

# The scored gate: the chip that matches the explain, and the one line the explain header prints.
answer: [text]
verdict: >-
  Mostly readable text: common ACARS is unencrypted, though some airlines compress or encrypt
  some messages.
