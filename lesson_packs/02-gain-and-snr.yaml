# ABOUTME: Lesson pack M2 "Turn It Up" — the gain/SNR intro; SNR is the gap between a signal and
# ABOUTME: the noise floor, and more gain lifts both at once, so it is not more signal.

id: 2
slug: gain-and-snr
title: "Turn It Up"
type: intro
concept: >-
  SNR is the gap between a signal and the noise floor; more gain is not more signal.
requires_tx: false
hardware: [rtl-sdr]
panels: [gain]

stages:
  frame: >-
    Tonight, comrade, you learn the one number that decides whether you can hear a signal at all — the
    gap between it and the noise — and why the knob everyone reaches for first, gain, is not
    that number.
  demo: >-
    Watch — hands off the gain for now. Decibels first: a dB is a ratio, and every 10 dB is ten
    times the power. The grassy band along the bottom is the noise floor; the station pokes up
    above it. The meter reads both. Peak minus floor is the SNR — the one number worth chasing.
  try: >-
    Now you drive, comrade. Step the gain with its − and + from the bottom up, and stop at three
    settings — low, middle, maximum. At each, read the floor, the peak and the gap off the meter
    and note them. Don't chase the tallest peak — just record what you see.
  predict: >-
    You've read the gap at low and middle gain. Before you push to the very top, make the call:
    from middle to maximum, will the gap get WIDER, stay about the SAME, or get NARROWER? Lock it
    in — the rest of the lesson stays hidden until you do.
  observe: >-
    Take the gain to maximum and hold it against your middle setting. Tell me what actually
    happened: did the floor and the peak move together or apart — and did the gap grow, hold, or
    close as you reached the top?
  explain: >-
    The peak and the floor rose together. Gain is an amplifier — a hearing aid in a loud
    restaurant that lifts your friend and the room alike — and it can't tell signal from noise.
    Past the middle the gap barely moved; at the very top it often shrinks, as strong signals
    overload the receiver and smear false copies across the band. That gap is SNR: it decides what
    you can hear, not the peak's height, and because decibels are a ratio it is a plain
    subtraction off the screen. Carry this out the door: set gain where the gap is widest, usually
    mid-scale; a bigger gap comes from a better or better-placed antenna, or getting closer, never
    more gain.

# The predict stage offers keyboard-free, tap-to-choose answers (no on-screen keyboard at the
# predict gate). Each is a {key, label}: the key is what the commit records, the label is what the
# learner reads. They stay neutral on purpose — the correct answer lives in `explain`, sealed
# behind the predict commit, so showing the choices never spoils the reveal.
choices:
  - {key: wider, label: Wider}
  - {key: same, label: About the same}
  - {key: narrower, label: Narrower}

# The scored gate. Two chips are right: the explain defends "about the same" past the middle and
# "narrower" at the very top, where overload can close the gap.
answer: [same, narrower]
verdict: >-
  About the same, or narrower: gain lifts signal and noise together, and at the top overload can
  close the gap.

# The post-lesson check: one new situation on this lesson's idea (gain is not signal; the gap is),
# scored after the explain. Each chip's `why` is the feedback for choosing it.
check:
  prompt: >-
    A weak station sits 6 dB over the floor, and your gain is already where the gap was widest.
    Which change is most likely to widen the gap?
  choices:
    - key: gain
      label: Turning the gain up
      why: Gain lifts the floor with the station, so the gap barely moves; at the top it can shrink.
    - key: contrast
      label: More screen contrast
      why: Contrast changes how the gap is painted, not its size; the meter's dB stay the same.
    - key: antenna
      label: A better antenna spot
      why: More signal at the antenna, from a better spot or getting closer, widens the gap; gain can't.
  answer: antenna
